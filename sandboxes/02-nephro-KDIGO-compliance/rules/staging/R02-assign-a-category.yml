##
# RULE: R02-assign-a-category
# AGENT: KDIGO::CKD::Agent::Staging  (pos. 1 / 4)
# CORPUS: §1.3 — KDIGO 2024 CKD Guideline — Evaluation of albuminuria (A categories)
#
# PURPOSE
#   Assigns the KDIGO 2024 albuminuria category (A1–A3) to a patient Frame
#   based on urine albumin-to-creatinine ratio (ACR) in mg/g.
#
# INPUTS  (slots read)
#   type_element  : discriminating slot — value "patient" (Strategy A)
#   acr_mg_g      : float — urine ACR in mg/g
#
# OUTPUTS (slots written)
#   ckd_a_category : "A1"|"A2"|"A3" — albuminuria category
#
# HELPERS
#   acr_to_a_category($acr_mg_g) → str
#
# GUARD — EXCEPTION: defined $p->{ckd_a_category}
#   Idempotence — prevents re-processing a patient already staged.
##
RULE: assign-a-category
FIND:
  p:
    attribut: type_element
    filtre: '$_->{type_element} eq "patient"'
EXCEPTION: defined $p->{ckd_a_category}
ACTION: |
  # Read ACR — skip silently if absent
  my $acr = $p->get('acr_mg_g');
  return 0 unless defined $acr;

  # Assign albuminuria category via helper (§1.3 — A category thresholds)
  my $cat = acr_to_a_category($acr);
  $p->set('ckd_a_category', $cat);
  1
