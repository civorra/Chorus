##
# RULE: R01-assign-g-category
# AGENT: KDIGO::CKD::Agent::Staging  (pos. 1 / 4)
# CORPUS: §1.1.2 — KDIGO 2024 CKD Guideline — Methods for staging of CKD (GFR categories)
#
# PURPOSE
#   Assigns the KDIGO 2024 GFR category (G1–G5) to a patient Frame based on eGFR.
#   G3 is subdivided into G3a (45–59) and G3b (30–44) per the KDIGO CGA system.
#
# INPUTS  (slots read)
#   type_element  : discriminating slot — value "patient" (Strategy A)
#   egfr_ml_min   : float — eGFR in ml/min per 1.73 m²
#
# OUTPUTS (slots written)
#   ckd_g_category : "G1"|"G2"|"G3a"|"G3b"|"G4"|"G5" — GFR category
#
# HELPERS
#   egfr_to_g_category($egfr_ml_min) → str
#
# GUARD — EXCEPTION: defined $p->{ckd_g_category}
#   Idempotence — prevents re-processing a patient already staged.
##
RULE: assign-g-category
FIND:
  p:
    attribut: type_element
    filtre: '$_->{type_element} eq "patient"'
EXCEPTION: defined $p->{ckd_g_category}
ACTION: |
  # Read eGFR — skip silently if absent
  my $egfr = $p->get('egfr_ml_min');
  return 0 unless defined $egfr;

  # Assign GFR category via helper (§1.1.2 — GFR category thresholds)
  my $cat = egfr_to_g_category($egfr);
  $p->set('ckd_g_category', $cat);
  1
