##
# RULE: R04-chronicity
# AGENT: KDIGO::CKD::Agent::Staging  (pos. 1 / 4)
# CORPUS: §1.1.3 — KDIGO 2024 CKD Guideline
#   Practice Points 1.1.3.1, 1.1.3.2 — Evaluation of chronicity
#
# PURPOSE
#   Chronicity flag: sets chronicity_confirmed = "yes" when ckd_duration_months ≥ 3
#   (3-month minimum threshold — PP 1.1.3.1), "unconfirmed" when < 3 months
#   (single presentation may be AKI/AKD — PP 1.1.3.2), "unknown" when absent.
#   Informational only — does not block pipeline progression.
#
# INPUTS  (slots read)
#   type_element         : discriminating slot — value "patient"
#   ckd_duration_months  : float (optional) — months since first abnormal measurement
#
# OUTPUTS (slots written)
#   chronicity_confirmed : "confirmed" | "unconfirmed" | "unknown"
#     - "confirmed"   : duration >= 3 months (PP 1.1.3.1)
#     - "unconfirmed" : duration < 3 months (possible AKI/AKD — PP 1.1.3.2)
#     - "unknown"     : no duration data provided
#
# GUARD — EXCEPTION: defined $p->{chronicity_confirmed}
##
RULE: chronicity
FIND:
  p:
    attribut: type_element
    filtre: '$_->{type_element} eq "patient"'
EXCEPTION: defined $p->{chronicity_confirmed}
ACTION: |
  # Read optional duration slot (PP 1.1.3.1: 3-month minimum)
  my $dur = $p->get('ckd_duration_months');

  if (!defined $dur) {
      # No duration data — cannot verify chronicity (informational flag)
      $p->set('chronicity_confirmed', 'unknown');
  } elsif ($dur >= 3) {
      # Duration >= 3 months: chronicity established (PP 1.1.3.1)
      $p->set('chronicity_confirmed', 'confirmed');
  } else {
      # Duration < 3 months: single presentation may represent AKI/AKD (PP 1.1.3.2)
      $p->set('chronicity_confirmed', 'unconfirmed');
  }
  1
