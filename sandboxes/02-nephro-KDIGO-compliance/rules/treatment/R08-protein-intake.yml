##
# RULE: R08-protein-intake
# AGENT: KDIGO::CKD::Agent::Treatment  (pos. 3 / 4)
# CORPUS: §3.3.1 — KDIGO 2024 CKD Guideline
#   Recommendation 3.3.1.1 (2C) + Practice Point 3.3.1.1
#   Protein intake in CKD G3–G5
#
# PURPOSE
#   Checks that adult CKD G3–G5 patients maintain protein intake of ~0.8 g/kg/d
#   and do not exceed 1.3 g/kg/d (high protein, risk of progression).
#   Only applicable for G3a, G3b, G4, G5. G1/G2: "NA" (not indicated).
#   If protein_intake_g_kg_d is absent → result is "NA".
#
# INPUTS  (slots read)
#   besoin_treatment      : targeting slot
#   ckd_g_category        : str — GFR category
#   protein_intake_g_kg_d : float — daily protein intake (optional)
#
# OUTPUTS (slots written)
#   protein_intake_ok : "OUI"|"NON"|"NA"
#
# GUARD — EXCEPTION: defined $p->{protein_intake_ok}
##
RULE: protein-intake
FIND:
  p:
    attribut: besoin_treatment
EXCEPTION: defined $p->{protein_intake_ok}
ACTION: |
  # Only applicable for CKD G3–G5 (§3.3.1.1)
  my $g = $p->get('ckd_g_category') // '';
  unless ($g =~ /^G(3|4|5)/) {
      $p->set('protein_intake_ok', 'NA');   # G1/G2 → not applicable
      return 1;
  }

  # Read protein intake — absent → NA
  my $protein = $p->get('protein_intake_g_kg_d');
  if (!defined $protein) {
      $p->set('protein_intake_ok', 'NA');
      return 1;
  }

  # Avoid high protein (>1.3 g/kg/d) — PP 3.3.1.1 risk of progression
  if ($protein > 1.3) {
      $p->set('protein_intake_ok', 'NON');   # exceeds threshold
      return 1;
  }

  # Target ~0.8 g/kg/d (Rec 3.3.1.1 2C) — accept 0.6–1.3 as compliant range
  if ($protein >= 0.6 && $protein <= 1.3) {
      $p->set('protein_intake_ok', 'OUI');
  } else {
      $p->set('protein_intake_ok', 'NON');   # below 0.6 → malnutrition risk
  }
  1
