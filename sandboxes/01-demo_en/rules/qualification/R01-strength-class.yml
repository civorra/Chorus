##
# RULE: R01-strength-class
# AGENT: TimberFrame::Agent::Qualification  (pos. 1 / 5)
# CORPUS: §2.1 — BS EN 338 — Minimum strength class by element type
#
# PURPOSE
#   Checks that the element's strength class meets the minimum required for its
#   type. Applies to structural and semi-structural elements only; insulation and
#   vapour control layers have no strength class requirement and are skipped.
#
# INPUTS  (slots read)
#   needs_compliance  : targeting slot — set by initial feed
#   type_element      : enum — element type
#   strength_class    : enum — BS EN 338 class (C14…C40)
#
# OUTPUTS (slots written)
#   strength_class_ok : 'YES' or 'NO' — strength class verdict for this element
#   rejection_reason  : string — failure reason (written only on rejection)
#
# HELPERS
#   min_strength_class_required($type_element) → string class or undef
#   class_rank($class) → integer rank (1..7) or 0 if unknown
#
# GUARD — EXCEPTION: defined $f->{strength_class_ok}
#   Idempotence — prevents re-processing a Frame already handled.
##
RULE: R01-strength-class
FIND:
  f:
    attribut: needs_compliance
    filtre: "defined $_->get('strength_class')"
EXCEPTION: defined $f->{strength_class_ok}
ACTION: |
  # Read element type and strength class
  my $type    = $f->get('type_element') // '';
  my $class   = $f->get('strength_class');

  # Determine minimum required class for this element type
  my $min_class = min_strength_class_required($type);

  # No requirement for this element type (insulation, VCL, etc.) — pass silently
  unless (defined $min_class) {
    $f->set('strength_class_ok', 'YES');
    return 1;
  }

  # Compare ranks — §2.1: any class below minimum is REJECTED
  my $rank_actual = class_rank($class);
  my $rank_min    = class_rank($min_class);

  if ($rank_actual < $rank_min) {
    $f->set('strength_class_ok', 'NO');
    $f->set('rejection_reason', "strength class $class below minimum $min_class for $type (§2.1)");
    return 1;
  }

  $f->set('strength_class_ok', 'YES');
  1
