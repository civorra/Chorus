##
# RULE: R03-deflection
# AGENT: TimberFrame::Agent::Qualification  (pos. 1 / 5)
# CORPUS: §2.3 — EC5 §7.2 — Allowable instantaneous deflection
#
# PURPOSE
#   Checks that the instantaneous deflection under load satisfies δ ≤ L/300,
#   with a minimum floor value of 5 mm over a 2 m span. Requires both
#   deflection_mm and span_mm; skipped silently if either is absent.
#
# INPUTS  (slots read)
#   needs_compliance  : targeting slot — set by initial feed
#   deflection_mm     : float — measured instantaneous deflection (mm)
#   span_mm           : float — span length L (mm)
#
# OUTPUTS (slots written)
#   deflection_ok    : 'YES' or 'NO' — deflection verdict
#   rejection_reason : string — failure reason (written only on rejection)
#
# GUARD — EXCEPTION: defined $f->{deflection_ok}
#   Idempotence — prevents re-processing a Frame already handled.
##
RULE: R03-deflection
FIND:
  f:
    attribut: needs_compliance
    filtre: "defined $_->get('deflection_mm') && defined $_->get('span_mm')"
EXCEPTION: defined $f->{deflection_ok}
ACTION: |
  # Read measured deflection and span — §2.3
  my $delta = $f->get('deflection_mm');
  my $span  = $f->get('span_mm');

  # Guard: span must be positive
  return 0 unless $span > 0;

  # Compute allowable deflection: L/300 — §2.3
  my $allowable = $span / 300;

  # Apply minimum floor: 5 mm over 2000 mm span
  $allowable = 5 if $span <= 2000 && $allowable < 5;

  # Check deflection ≤ allowable — §2.3
  if ($delta > $allowable) {
    $f->set('deflection_ok', 'NO');
    $f->set('rejection_reason',
      sprintf("deflection %.2f mm exceeds L/300 = %.2f mm (span=%d mm) (§2.3)",
        $delta, $allowable, $span));
    return 1;
  }

  $f->set('deflection_ok', 'YES');
  1
