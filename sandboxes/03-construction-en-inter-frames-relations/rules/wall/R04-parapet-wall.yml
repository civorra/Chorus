##
# RULE: R04-parapet-wall
# AGENT: ADA::Agent::Wall  (pos. 2 / 4)
# CORPUS: §2C18 — Approved Document A (Structure) 2013 — Parapet walls
#
# PURPOSE
#   Verifies parapet wall thickness and height constraints:
#   - Type A (cavity parapet): thickness ≥ 215mm, height Hp ≤ 0.86m
#   - Type B (solid parapet):  thickness ≥ 215mm, height Hp ≤ min(3t, 0.6m)
#   Sets besoin_masonry for masonry strength check on parapet units.
#
# INPUTS  (slots read)
#   besoin_wall  : targeting slot — 'Y'
#   type_element : 'parapet_wall' (filtre)
#   parapet_type : 'A' (cavity) or 'B' (solid)
#   thickness_mm : int — parapet wall thickness in mm
#   height_m     : float — parapet height Hp in metres
#
# OUTPUTS (slots written)
#   wall_thickness_ok : 'YES'/'NO' — thickness verdict
#   wall_violations   : str — violated constraints
#   wall_ok           : 'YES'/'NO' — overall verdict
#   besoin_masonry    : 'Y' — targeting slot for ADA::Agent::Masonry
#
# GUARD — EXCEPTION: defined $w->{wall_ok}
#   Idempotence.
##
RULE: R04-parapet-wall
FIND:
  w:
    attribut: besoin_wall
    filtre: '($_->get("type_element")//"") eq "parapet_wall"'
EXCEPTION: defined $w->{wall_ok}
ACTION: |
  my @violations;
  my $pt = $w->get('parapet_type')  // 'B';
  my $t  = $w->get('thickness_mm')  // 0;
  my $hp = $w->get('height_m')      // 0;

  if ($pt eq 'A') {
      # Type A (cavity): §2C18 — min 215mm, Hp ≤ 0.86m
      push @violations, "parapet type A: thickness ${t}mm < 215mm min (§2C18)" if $t < 215;
      push @violations, "parapet type A: height ${hp}m > 0.86m max (§2C18)"    if $hp > 0.86;
  } elsif ($pt eq 'B') {
      # Type B (solid): §2C18 — min 215mm, Hp ≤ min(3t in metres, 0.6m)
      push @violations, "parapet type B: thickness ${t}mm < 215mm min (§2C18)" if $t < 215;
      my $max_hp = ($t > 0) ? ($t * 3 / 1000 < 0.6 ? $t * 3 / 1000 : 0.6) : 0.6;
      push @violations,
          sprintf("parapet type B: height %.2fm > max %.2fm (3t or 0.6m, §2C18)", $hp, $max_hp)
          if $hp > $max_hp;
  }

  $w->set('wall_thickness_ok', @violations ? 'NO' : 'YES');
  $w->set('wall_violations',   join('; ', @violations));
  $w->set('wall_ok',           @violations ? 'NO' : 'YES');
  $w->set('besoin_masonry',    'Y');
  1
