##
# RULE: R06-tie-spacing
# AGENT: ADA::Agent::Wall  (pos. 2 / 5)
# CORPUS: §2C8 — UK Approved Document A 2013 — Cavity walls in coursed brickwork or blockwork
#
# PURPOSE
#   Verifies that the spacing of cavity wall ties meets §2C8 requirements:
#   horizontal ≤ 900mm, vertical ≤ 450mm (or equivalent density ≥ 2.5 ties/m²),
#   and edge spacing ≤ 300mm within 225mm of opening edges, movement joints and roof verges.
#   Applies to external_wall Frames of cavity construction where spacing data is provided.
#
# INPUTS  (slots read)
#   besoin_wall        : targeting slot — set by ADA::Agent::Geometry R01/R02/R03
#   type_element       : 'external_wall' — filter
#   wall_type          : 'cavity' — filter
#   tie_h_spacing_mm   : horizontal tie spacing (mm) — max 900mm per §2C8
#   tie_v_spacing_mm   : vertical tie spacing (mm) — max 450mm per §2C8
#   tie_edge_spacing_mm: spacing at openings/edges (mm) — max 300mm per §2C8
#
# OUTPUTS (slots written)
#   tie_spacing_ok   : 'YES'/'NO' — tie spacing compliance verdict
#   wall_violations  : updated with spacing violations
#   wall_ok          : set to 'NO' if spacing violations found
#
# GUARD — EXCEPTION: defined $w->{tie_spacing_ok}
#   Idempotence — prevents re-processing a Frame already handled.
##
RULE: R06-tie-spacing
FIND:
  w:
    attribut: besoin_wall
    filtre: >
      ($_->get('type_element')//"") eq "external_wall"
      && ($_->get('wall_type')//"") eq "cavity"
      && (defined $_->get('tie_h_spacing_mm') || defined $_->get('tie_v_spacing_mm'))
EXCEPTION: defined $w->{tie_spacing_ok}
ACTION: |
  # Read input slots (default to compliant values when absent)
  my $hs = $w->get('tie_h_spacing_mm')    // 900;   # mm
  my $vs = $w->get('tie_v_spacing_mm')    // 450;   # mm
  my $es = $w->get('tie_edge_spacing_mm') // 0;     # mm (0 = not provided)

  my @viol = split /;\s*/, ($w->get('wall_violations') // '');

  # §2C8: horizontal spacing ≤ 900mm
  push @viol, "tie horizontal spacing ${hs}mm > 900mm max (§2C8)" if $hs > 900;

  # §2C8: vertical spacing ≤ 450mm
  push @viol, "tie vertical spacing ${vs}mm > 450mm max (§2C8)"   if $vs > 450;

  # §2C8: edge spacing ≤ 300mm within 225mm of openings, movement joints and roof verges
  if ($es > 0) {
      push @viol, "tie edge spacing ${es}mm > 300mm max at openings/verges (§2C8)"
          if $es > 300;
  }

  # §2C8 density check: 900mm × 450mm → 2.47 ties/m² (below 2.5 minimum)
  # Flag only when both spacings are at their maximum
  if ($hs >= 900 && $vs >= 450) {
      my $density = (1000.0 / $hs) * (1000.0 / $vs);
      if ($density < 2.5) {
          push @viol, sprintf(
              "tie density %.2f/m² < 2.5/m² (§2C8 alt. arrangement) — reduce spacing", $density);
      }
  }

  # Write results
  my $ok = @viol ? 'NO' : 'YES';
  $w->set('tie_spacing_ok',   $ok);
  $w->set('wall_violations',  join('; ', @viol));
  $w->set('wall_ok', 'NO') if $ok eq 'NO';
  1
