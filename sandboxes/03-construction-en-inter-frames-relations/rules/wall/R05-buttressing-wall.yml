##
# RULE: R05-buttressing-wall
# AGENT: ADA::Agent::Wall  (pos. 2 / 4)
# CORPUS: §2C17 — Approved Document A (Structure) 2013 — Buttressing walls
#
# PURPOSE
#   Verifies that a buttressing wall satisfies §2C17: buttressing wall length
#   must be ≥ H/6 (where H is the height of the supported wall).
#   H is resolved via the inter-frame link 'supports' → external_wall Frame.
#
# INPUTS  (slots read)
#   besoin_wall          : targeting slot — 'Y'
#   type_element         : 'buttressing_wall' (filtre)
#   supports             : Frame ref — the external_wall this wall buttresses
#                          (resolved from supports_ref by Feed.pm at load time)
#   supports.height_m    : float — height of the supported wall (read via link)
#   buttressing_length_m : float — buttressing wall length in metres
#
# OUTPUTS (slots written)
#   buttressing_ok  : 'YES'/'NO' — §2C17 verdict
#   wall_violations : str — violated constraints
#   wall_ok         : 'YES'/'NO' — overall verdict
#
# GUARD — EXCEPTION: defined $w->{wall_ok}
#   Idempotence.
##
RULE: R05-buttressing-wall
FIND:
  w:
    attribut: besoin_wall
    filtre: '($_->get("type_element")//"") eq "buttressing_wall"'
EXCEPTION: defined $w->{wall_ok}
ACTION: |
  my @violations;

  # Navigate to the supported external_wall via inter-frame link (optional).
  # Falls back to $w->{height_m} when no 'supports' link is present
  # (backward-compatible with project files that carry height_m directly).
  my $sup = $w->get('supports');
  my $h   = $sup ? ($sup->get('height_m') // 0) : ($w->get('height_m') // 0);
  my $bl = $w->get('buttressing_length_m')  // 0;

  # §2C17: buttressing wall length ≥ H/6
  if ($h > 0) {
      my $min_len = $h / 6;
      if ($bl < $min_len) {
          push @violations,
              sprintf("buttressing_length %.2fm < H/6 = %.3fm (§2C17, H=%.2fm from %s)",
                      $bl, $min_len, $h, ($sup ? $sup->get('id') : '?'));
      }
  }

  $w->set('buttressing_ok',  @violations ? 'NO' : 'YES');
  $w->set('wall_violations', join('; ', @violations));
  $w->set('wall_ok',         @violations ? 'NO' : 'YES');
  1
