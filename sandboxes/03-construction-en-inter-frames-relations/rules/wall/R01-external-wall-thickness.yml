##
# RULE: R01-external-wall-thickness
# AGENT: ADA::Agent::Wall  (pos. 2 / 4)
# CORPUS: Table 3 — Approved Document A (Structure) 2013 — Minimum wall thickness
#         §2C6 — Solid wall thickness ≥ storey_height/16
#         §2C12 — Single-leaf external walls of non-residential/annexes: 90mm min only
#         §2C17 — Cavity wall leaf thickness (90mm min) and cavity width (50–175mm)
#
# PURPOSE
#   Verifies minimum thickness of external, compartment and separating walls per
#   Table 3 (based on wall height and length). Also checks:
#   - solid wall §2C6 rule: thickness ≥ storey_height/16
#   - §2C12 exception: if single_leaf='Y' (non-residential/annexe single-leaf wall)
#     the minimum is 90mm only — Table 3 and §2C6 do not apply
#   - cavity wall: each leaf ≥ 90mm, cavity width 50–175mm
#   Sets besoin_masonry targeting slot for ADA::Agent::Masonry.
#
# INPUTS  (slots read)
#   besoin_wall     : targeting slot — 'Y' — set by Geometry R01/R02/R03
#   type_element    : must be 'external_wall' (filtre)
#   wall_type       : 'solid' or 'cavity'
#   thickness_mm    : int — total wall thickness in mm
#   height_m        : float — wall height in metres
#   length_m        : float — wall length in metres
#   storey_height_m : float — storey height Hs (metres) — for §2C6
#   leaf_inner_mm   : int — inner leaf thickness (mm) — cavity walls
#   leaf_outer_mm   : int — outer leaf thickness (mm) — cavity walls
#   cavity_width_mm : int — cavity width (mm) — cavity walls
#   single_leaf     : 'Y' if single-leaf non-residential/annexe wall (§2C12)
#
# OUTPUTS (slots written)
#   wall_thickness_ok : 'YES'/'NO' — Table 3 / §2C6 verdict
#   cavity_ok         : 'YES'/'NO' — leaf/cavity dimensions
#   wall_violations   : str — violated constraints
#   wall_ok           : 'YES'/'NO' — overall verdict
#   besoin_masonry    : 'Y' — targeting slot for ADA::Agent::Masonry
#
# HELPERS
#   min_thickness_table3($height_m, $length_m) → $mm
#   min_tie_length_table5($cavity_width_mm)    → $mm | undef  (used by R02)
#
# GUARD — EXCEPTION: defined $w->{wall_ok}
#   Idempotence — prevents re-processing an already-verified wall Frame.
##
RULE: R01-external-wall-thickness
FIND:
  w:
    attribut: besoin_wall
    filtre: '($_->get("type_element")//"") eq "external_wall"'
EXCEPTION: defined $w->{wall_ok}
ACTION: |
  use ADA::Agent::Wall::Helpers qw(min_thickness_table3);
  my @violations;

  my $h          = $w->get('height_m')         // 0;
  my $l          = $w->get('length_m')         // 0;
  my $t          = $w->get('thickness_mm')     // 0;
  my $hs         = $w->get('storey_height_m')  // 0;
  my $wt         = $w->get('wall_type')        // 'solid';
  my $single_lf  = $w->get('single_leaf')      // '';

  # §2C12 exception: single-leaf external wall of non-residential/annexe — 90mm only
  if ($single_lf eq 'Y') {
      if ($t < 90) {
          push @violations, "single-leaf thickness ${t}mm < 90mm min (§2C12)";
          $w->set('wall_thickness_ok', 'NO');
      } else {
          $w->set('wall_thickness_ok', 'YES');
      }
      # §2C12 walls bypass Table 3 and §2C6 checks — cavity check still applies
      my $cav_ok = 'YES';
      if ($wt eq 'cavity') {
          my $li = $w->get('leaf_inner_mm')   // 0;
          my $lo = $w->get('leaf_outer_mm')   // 0;
          my $cw = $w->get('cavity_width_mm') // 0;
          push @violations, "inner_leaf ${li}mm < 90mm min (§2C17)" if $li < 90;
          push @violations, "outer_leaf ${lo}mm < 90mm min (§2C17)" if $lo < 90;
          push @violations, "cavity ${cw}mm outside 50-175mm range (§2C17)"
              if $cw < 50 || $cw > 175;
          $cav_ok = @violations ? 'NO' : 'YES';
      }
      $w->set('cavity_ok',       $cav_ok);
      $w->set('wall_violations', join('; ', @violations));
      $w->set('wall_ok',         @violations ? 'NO' : 'YES');
      $w->set('besoin_masonry',  'Y');
      return 1;
  }

  # Standard path — Table 3 + §2C6
  # Table 3: minimum thickness check
  my $min_t = min_thickness_table3($h, $l);
  push @violations, "thickness ${t}mm < min ${min_t}mm (Table 3, H=${h}m, L=${l}m)"
      if $t < $min_t;

  # §2C6: solid wall — thickness ≥ storey_height / 16
  if ($wt eq 'solid' && $hs > 0) {
      my $min_t_2c6 = int($hs * 1000 / 16);
      push @violations, "thickness ${t}mm < Hs/16 = ${min_t_2c6}mm (§2C6, Hs=${hs}m)"
          if $t < $min_t_2c6;
  }

  # Cavity wall: leaf and cavity dimensions
  my $cav_ok = 'YES';
  if ($wt eq 'cavity') {
      my $li  = $w->get('leaf_inner_mm')   // 0;
      my $lo  = $w->get('leaf_outer_mm')   // 0;
      my $cw  = $w->get('cavity_width_mm') // 0;
      if ($li < 90) {
          push @violations, "inner_leaf ${li}mm < 90mm min (§2C17)";
          $cav_ok = 'NO';
      }
      if ($lo < 90) {
          push @violations, "outer_leaf ${lo}mm < 90mm min (§2C17)";
          $cav_ok = 'NO';
      }
      if ($cw < 50 || $cw > 175) {
          push @violations, "cavity ${cw}mm outside 50-175mm range (§2C17)";
          $cav_ok = 'NO';
      }
  }

  $w->set('wall_thickness_ok', ($t >= $min_t) ? 'YES' : 'NO');
  $w->set('cavity_ok',         $cav_ok);
  $w->set('wall_violations',   join('; ', @violations));
  $w->set('wall_ok',           @violations ? 'NO' : 'YES');
  $w->set('besoin_masonry',    'Y');
  1
