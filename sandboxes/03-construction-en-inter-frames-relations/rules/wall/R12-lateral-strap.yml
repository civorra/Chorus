##
# RULE: R12-lateral-strap
# AGENT: ADA::Agent::Wall  (pos. 2 / 6)
# CORPUS: §2C32-35 — Approved Document A 2013 — Lateral support by roofs and floors
#          Table 9 — Lateral support for walls (p.31)
#          Diagram 15 — Lateral support by floors (p.32)
#
# PURPOSE
#   Verifies that walls have adequate horizontal lateral support per §2C32-35:
#   - Tension straps at intervals ≤ 2m above ground floor (§2C35)
#   - External/compartment/separating walls longer than 3m require floor support
#     at every floor forming a junction (Table 9)
#   - Internal loadbearing walls require roof or floor support at the top of each storey (Table 9)
#   Fires only when at least one lateral support slot is provided by the feed.
#
# INPUTS  (slots read)
#   besoin_wall           : targeting slot
#   type_element          : 'external_wall' or 'internal_wall'
#   length_m              : wall length L (metres) — for Table 9 > 3m check
#   strap_spacing_m       : actual strap interval in metres (§2C35 max 2m)
#   has_floor_support     : 'Y'/'N' — whether every floor provides lateral support (Table 9)
#
# OUTPUTS (slots written)
#   lateral_support_ok    : 'YES'/'NO' — lateral support meets §2C32-35 / Table 9
#   wall_violations       : cumulative violation list
#   wall_ok               : updated to 'NO' on violation
#
# GUARD — EXCEPTION: defined $w->{lateral_support_ok}
#   Idempotence — prevents re-processing a Frame already handled in a previous cycle.
##
RULE: lateral-strap
FIND:
  w:
    attribut: besoin_wall
    filtre: |
      ($_->get('type_element')//"") =~ /^(external_wall|internal_wall)$/
      && (defined $_->get('strap_spacing_m') || defined $_->get('has_floor_support'))
EXCEPTION: defined $w->{lateral_support_ok}
ACTION: |
  # Read inputs
  my @viol   = split /;\s*/, ($w->get('wall_violations') // '');
  my $type   = $w->get('type_element')     // '';
  my $len    = $w->get('length_m')         // 0;
  my $strap  = $w->get('strap_spacing_m');
  my $floor  = $w->get('has_floor_support');

  # §2C35: tension strap spacing ≤ 2m above ground floor level
  if (defined $strap && $strap > 2.0) {
      push @viol, "strap spacing ${strap}m > 2.0m max (§2C35)";
  }

  # Table 9: external/compartment/separating walls > 3m → floor support required
  if ($type eq 'external_wall' && $len > 3.0) {
      if (defined $floor && $floor ne 'Y') {
          push @viol,
              "external wall length ${len}m > 3m: floor lateral support required at every floor (Table 9)";
      }
  }

  # Table 9: internal loadbearing wall → roof or floor support at top of each storey
  # (has_floor_support 'Y' covers this requirement)
  if ($type eq 'internal_wall') {
      if (defined $floor && $floor ne 'Y') {
          push @viol,
              "internal loadbearing wall: roof or floor lateral support required at top of each storey (Table 9)";
      }
  }

  # Write results
  my $ok = @viol ? 'NO' : 'YES';
  $w->set('lateral_support_ok', $ok);
  $w->set('wall_violations',    join('; ', @viol));
  $w->set('wall_ok', 'NO') if $ok eq 'NO';
  1
