##
# RULE: R08-end-restraint
# AGENT: ADA::Agent::Wall  (pos. 2 / 5)
# CORPUS: §2C25 — UK Approved Document A 2013 — Vertical lateral restraint to walls
#          §2C27 — UK Approved Document A 2013 — Design criteria for piers and chimneys
#
# PURPOSE
#   Verifies pier dimensions for end restraint per §2C27:
#   - Pier thickness ≥ 3 × thickness of supported wall (§2C27a)
#   - Pier minimum width 190mm (§2C27a, Diagram 13)
#   Applies to buttressing_wall Frames where pier dimension data is present.
#   Note: buttressing wall length ≥ H/6 is already checked in R05.
#
# INPUTS  (slots read)
#   besoin_wall          : targeting slot
#   type_element         : 'buttressing_wall' — filter
#   supports             : Frame ref — the external_wall this wall buttresses
#                          (resolved from supports_ref by Feed.pm at load time)
#   supports.thickness_mm: T = thickness of the supported wall (read via link)
#   pier_thickness_mm    : pier thickness ⊥ to supported wall (mm) — §2C27a: ≥ 3T
#   pier_width_mm        : pier width (mm) — §2C27a: min 190mm
#
# OUTPUTS (slots written)
#   end_restraint_ok : 'YES'/'NO' — pier dimension compliance verdict
#   wall_violations  : updated with pier violations
#   wall_ok          : set to 'NO' if violations found
#
# GUARD — EXCEPTION: defined $w->{end_restraint_ok}
#   Idempotence — prevents re-processing a Frame already handled.
##
RULE: R08-end-restraint
FIND:
  w:
    attribut: besoin_wall
    filtre: >
      ($_->get('type_element')//"") eq "buttressing_wall"
      && (defined $_->get('pier_thickness_mm') || defined $_->get('pier_width_mm'))
EXCEPTION: defined $w->{end_restraint_ok}
ACTION: |
  my @viol = split /;\s*/, ($w->get('wall_violations') // '');

  my $pt = $w->get('pier_thickness_mm') // 0;   # mm — measured ⊥ to supported wall
  my $pw = $w->get('pier_width_mm')     // 0;   # mm — min 190mm

  # Navigate to the supported external_wall via inter-frame link (optional).
  # Falls back to $w->{buttressing_thickness_mm} when no 'supports' link is present
  # (backward-compatible with project files that carry thickness directly).
  my $sup = $w->get('supports');
  my $T   = $sup ? ($sup->get('thickness_mm')    // 0)
                 : ($w->get('buttressing_thickness_mm') // 0);

  # §2C27a: pier thickness ≥ 3T
  if ($pt > 0 && $T > 0) {
      my $min_pt = 3 * $T;
      push @viol,
          sprintf("pier thickness ${pt}mm < 3×T = ${min_pt}mm (§2C27a, T=${T}mm from %s)",
                  $sup->get('id') // '?')
          if $pt < $min_pt;
  }

  # §2C27a: pier minimum width 190mm (parallel to supported wall)
  if ($pw > 0) {
      push @viol, "pier width ${pw}mm < 190mm min (§2C27a, Diagram 13)" if $pw < 190;
  }

  my $ok = @viol ? 'NO' : 'YES';
  $w->set('end_restraint_ok', $ok);
  $w->set('wall_violations',  join('; ', @viol));
  $w->set('wall_ok', 'NO') if $ok eq 'NO';
  1
