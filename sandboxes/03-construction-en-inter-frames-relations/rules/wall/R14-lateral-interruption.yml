##
# RULE: R14-lateral-interruption
# AGENT: ADA::Agent::Wall  (pos. 2 / 6)
# CORPUS: §2C37 — Approved Document A 2013 — Interruption of lateral support
#
# PURPOSE
#   Verifies conditions for an interruption in lateral support where a floor or
#   roof opening (e.g. stairway) adjoins a supported wall per §2C37:
#   a. Maximum opening length (parallel to wall) ≤ 3m
#   d. No other interruption of lateral support in the same storey
#   Fires on wall Frames where a lateral support interruption is declared by the feed.
#
# INPUTS  (slots read)
#   besoin_wall              : targeting slot
#   has_lateral_interruption : 'Y' — wall has a floor/roof opening for stairway (set by feed)
#   stairway_opening_m       : length of opening parallel to the wall, metres (§2C37a ≤ 3m)
#   other_interruptions      : 'Y'/'N' — whether any other lateral support interruption exists
#                              in the same storey (§2C37d: must be 'N')
#
# OUTPUTS (slots written)
#   lateral_interruption_ok  : 'YES'/'NO'
#   wall_violations          : cumulative violation list
#   wall_ok                  : updated to 'NO' on violation
#
# GUARD — EXCEPTION: defined $w->{lateral_interruption_ok}
#   Idempotence — prevents re-processing a Frame already handled in a previous cycle.
##
RULE: lateral-interruption
FIND:
  w:
    attribut: besoin_wall
    filtre: "($_->get('has_lateral_interruption')//'') eq 'Y'"
EXCEPTION: defined $w->{lateral_interruption_ok}
ACTION: |
  my @viol = split /;\s*/, ($w->get('wall_violations') // '');

  # §2C37a: opening length parallel to wall ≤ 3m
  my $open = $w->get('stairway_opening_m') // 0;
  if ($open > 3.0) {
      push @viol, "stairway opening ${open}m > 3.0m max parallel to wall (§2C37a)";
  }

  # §2C37d: no other interruption of lateral support
  my $other = $w->get('other_interruptions') // 'N';
  if ($other eq 'Y') {
      push @viol,
          "other lateral support interruption present in same storey — not permitted (§2C37d)";
  }

  my $ok = @viol ? 'NO' : 'YES';
  $w->set('lateral_interruption_ok', $ok);
  $w->set('wall_violations',         join('; ', @viol));
  $w->set('wall_ok', 'NO') if $ok eq 'NO';
  1
