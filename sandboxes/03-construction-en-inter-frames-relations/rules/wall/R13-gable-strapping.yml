##
# RULE: R13-gable-strapping
# AGENT: ADA::Agent::Wall  (pos. 2 / 6)
# CORPUS: §2C36 — Approved Document A 2013 — Gable walls
#          Diagram 16 — Lateral support at roof level (p.33)
#
# PURPOSE
#   Verifies that gable walls are strapped to the roof structure per §2C36:
#   - Vertical strapping at eaves level at intervals ≤ 2m (Diagram 16c/d)
#   Strapping may be OMITTED only if ALL four conditions are met simultaneously:
#     a. roof pitch ≥ 15°
#     b. roof is tiled or slated
#     c. roof type is known to be resistant to wind gusts
#     d. main timber members span onto the wall at ≤ 1.2m centres
#   Fires only on external_wall Frames where is_gable_wall = 'Y'.
#
# INPUTS  (slots read)
#   besoin_wall                 : targeting slot
#   type_element                : must be 'external_wall'
#   is_gable_wall               : 'Y' — flag set by feed for gable-end external walls
#   gable_strap_spacing_m       : actual vertical strap interval at eaves (metres)
#   roof_pitch_deg              : roof pitch in degrees (§2C36 exempt threshold: ≥ 15°)
#   roof_covering_type          : 'tiled', 'slated', or 'other' (§2C36a/b)
#   roof_wind_resistant         : 'Y'/'N' — roof is locally known wind-resistant (§2C36c)
#   roof_main_member_spacing_m  : main timber member spacing in metres (§2C36d, max 1.2m)
#
# OUTPUTS (slots written)
#   gable_strapping_ok    : 'YES'/'NO'
#   wall_violations       : cumulative violation list
#   wall_ok               : updated to 'NO' on violation
#
# GUARD — EXCEPTION: defined $w->{gable_strapping_ok}
#   Idempotence — prevents re-processing a Frame already handled in a previous cycle.
##
RULE: gable-strapping
FIND:
  w:
    attribut: besoin_wall
    filtre: |
      ($_->get('type_element')//"") eq "external_wall"
      && ($_->get('is_gable_wall')//"") eq "Y"
EXCEPTION: defined $w->{gable_strapping_ok}
ACTION: |
  my @viol   = split /;\s*/, ($w->get('wall_violations') // '');
  my $strap  = $w->get('gable_strap_spacing_m');
  my $pitch  = $w->get('roof_pitch_deg')           // 0;
  my $cover  = $w->get('roof_covering_type')       // 'other';
  my $windok = $w->get('roof_wind_resistant')      // 'N';
  my $mems   = $w->get('roof_main_member_spacing_m') // 99;

  # §2C36: check whether strapping is exempt
  my $exempt = (
      $pitch  >= 15            &&    # a. pitch ≥ 15°
      $cover  =~ /^(tiled|slated)$/i &&  # b. tiled or slated
      $windok eq 'Y'           &&    # c. wind-resistant
      $mems   <= 1.2                 # d. main members ≤ 1.2m centres
  ) ? 1 : 0;

  if (!$exempt) {
      # Strapping is required — check strap spacing ≤ 2m at eaves
      if (defined $strap && $strap > 2.0) {
          push @viol,
              "gable vertical strapping ${strap}m > 2.0m max at eaves (§2C36 Diagram 16)";
      } elsif (!defined $strap) {
          push @viol,
              "gable wall: vertical strapping required at eaves (≤ 2m, §2C36) — no data provided";
      }
  }
  # If exempt: no strapping required → no violation

  my $ok = @viol ? 'NO' : 'YES';
  $w->set('gable_strapping_ok', $ok);
  $w->set('wall_violations',    join('; ', @viol));
  $w->set('wall_ok', 'NO') if $ok eq 'NO';
  1
