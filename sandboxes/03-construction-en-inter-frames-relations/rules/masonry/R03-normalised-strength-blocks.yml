##
# RULE: R03-normalised-strength-blocks
# AGENT: ADA::Agent::Masonry  (pos. 3 / 4)
# CORPUS: Table 7 — Approved Document A (Structure) 2013
#         — Normalised compressive strength of clay and calcium silicate blocks
#
# PURPOSE
#   Verifies normalised compressive strength of clay and calcium silicate block
#   units per Table 7 (Conditions A/B/C, Groups 1 and 2). Only fires on block
#   Frames of clay or calcium_silicate material where normalised_strength_nmm2
#   is provided in the JSON input.
#
# INPUTS  (slots read)
#   besoin_masonry            : targeting slot — 'Y'
#   masonry_unit_type         : 'block' (filtre)
#   masonry_material          : 'clay' or 'calcium_silicate' (filtre)
#   masonry_condition         : 'A'/'B'/'C' — set by R01 (CONDITION guard)
#   normalised_strength_nmm2  : float — normalised strength (CONDITION: must be defined)
#   masonry_group             : 1 or 2
#   _ISA → masonry spec prototype (injected by Feed.pm via fselect)
#     min_norm_str_A / min_norm_str_B / min_norm_str_C : Table 7 threshold (inherited via _ISA)
#
# OUTPUTS (slots written)
#   masonry_normalised_ok : 'YES'/'NO' — Table 7 verdict
#   masonry_violations    : updated if normalised strength fails
#   masonry_ok            : updated to 'NO' if normalised strength fails
#
# GUARD — EXCEPTION: defined $w->{masonry_normalised_ok}
#   Idempotence.
##
RULE: R03-normalised-strength-blocks
FIND:
  w:
    attribut: besoin_masonry
    filtre: '($_->get("masonry_unit_type")//"") eq "block" && ($_->get("masonry_material")//"") =~ /^(clay|calcium_silicate)$/'
EXCEPTION: defined $w->{masonry_normalised_ok}
CONDITION: defined $w->get('masonry_condition') && defined $w->get('normalised_strength_nmm2')
ACTION: |
  my $cond     = $w->get('masonry_condition')        // 'A';
  my $grp      = $w->get('masonry_group')            // 1;
  my $norm_str = $w->get('normalised_strength_nmm2') // 0;

  # Read Table 7 threshold via _ISA → masonry spec prototype (injected by Feed.pm)
  my $min_norm = $w->get("min_norm_str_$cond") // 21.0;  # 21.0 = conservative fallback
  my @viol = grep { length $_ } split /;\s*/, ($w->get('masonry_violations') // '');

  if ($norm_str < $min_norm) {
      push @viol,
          "normalised_strength ${norm_str}N/mm2 < min ${min_norm}N/mm2 "
          . "(Table 7, cond $cond, Gr$grp)";
      $w->set('masonry_normalised_ok', 'NO');
      $w->set('masonry_ok',            'NO');
  } else {
      $w->set('masonry_normalised_ok', 'YES');
  }

  $w->set('masonry_violations', join('; ', @viol));
  1
