##
# RULE: R02-masonry-strength
# AGENT: ADA::Agent::Masonry  (pos. 3 / 4)
# CORPUS: Table 6 — Approved Document A (Structure) 2013 — Declared compressive strength
#         §2C21 — Compressive strength requirements
#
# PURPOSE
#   Verifies that the declared compressive strength of masonry units (N/mm²) meets
#   the Table 6 minimum for the masonry condition (A/B/C), unit type (brick/block),
#   material, and group (1 or 2). Manufactured stone (BS EN 771-5) is always
#   acceptable (no numeric minimum). Sets besoin_foundation on external walls.
#
# INPUTS  (slots read)
#   besoin_masonry           : targeting slot — 'Y'
#   masonry_condition        : 'A'/'B'/'C' — set by R01 (CONDITION guard)
#   masonry_unit_type        : 'brick' or 'block'
#   masonry_material         : clay/calcium_silicate/aggregate_concrete/aac/manufactured_stone
#   masonry_group            : 1 or 2
#   declared_strength_nmm2   : float — declared compressive strength (N/mm²)
#   type_element             : read to gate besoin_foundation (external_wall only)
#   _ISA → masonry spec prototype (injected by Feed.pm via fselect)
#     min_str_A / min_str_B / min_str_C : normative Table 6 threshold (inherited via _ISA)
#                                         undef = no numeric min (manufactured_stone or Table 7 path)
#
# OUTPUTS (slots written)
#   masonry_strength_ok : 'YES'/'NO' — Table 6 verdict
#   masonry_violations  : str — violated constraints
#   masonry_ok          : 'YES'/'NO' — overall masonry verdict
#   besoin_foundation   : 'Y' — set only on external_wall Frames
#
# GUARD — EXCEPTION: defined $w->{masonry_ok}
#   Idempotence.
##
RULE: R02-masonry-strength
FIND:
  w:
    attribut: besoin_masonry
EXCEPTION: defined $w->{masonry_ok}
CONDITION: defined $w->get('masonry_condition')
ACTION: |
  my @violations;

  my $cond    = $w->get('masonry_condition')      // 'A';
  my $utype   = $w->get('masonry_unit_type')      // 'brick';
  my $mat     = $w->get('masonry_material')       // 'clay';
  my $grp     = $w->get('masonry_group')          // 1;
  my $dec_str = $w->get('declared_strength_nmm2') // 0;

  # Read Table 6 threshold via _ISA → masonry spec prototype (injected by Feed.pm)
  # Returns undef for manufactured_stone or clay/CaSi blocks (→ Table 7 path, R03)
  my $min_str = $w->get("min_str_$cond");

  if (!defined $min_str) {
      # No numeric minimum: manufactured_stone (always acceptable) or Table 7 path
      $w->set('masonry_strength_ok', 'YES');
  } elsif ($dec_str < $min_str) {
      push @violations,
          "declared_strength ${dec_str}N/mm2 < min ${min_str}N/mm2 "
          . "(Table 6, cond $cond, $utype/$mat Gr$grp)";
      $w->set('masonry_strength_ok', 'NO');
  } else {
      $w->set('masonry_strength_ok', 'YES');
  }

  $w->set('masonry_violations', join('; ', @violations));
  $w->set('masonry_ok',         @violations ? 'NO' : 'YES');

  # Set besoin_foundation only on external_wall (parapet_wall is above roof)
  $w->set('besoin_foundation', 'Y')
      if ($w->get('type_element') // '') eq 'external_wall';
  1
