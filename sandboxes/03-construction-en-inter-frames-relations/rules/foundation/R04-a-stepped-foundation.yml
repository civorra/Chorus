##
# RULE: R04-a-stepped-foundation
# AGENT: ADA::Agent::Foundation  (pos. 4 / 5)
# CORPUS: §2E2d — Approved Document A (Structure) 2013 — Stepped foundation overlap
#          §2E2e — Approved Document A (Structure) 2013 — Maximum step height
#
# PURPOSE
#   Verifies that stepped foundations comply with §2E2d-e and Diagram 21:
#   - Step height S must not exceed foundation thickness T (§2E2e)
#   - Overlap L at each step must be ≥ max(2S, T, 300mm) for strip foundations
#   - Overlap L at each step must be ≥ max(2S, 1000mm) for trench fill foundations
#   Only fires when step_height_mm is present in the feed (flat foundations skip silently).
#
# INPUTS  (slots read)
#   besoin_foundation      : targeting slot — 'Y' — set by Masonry R02
#   step_height_mm         : int — step height S in mm (§2E2e; triggers this rule)
#   foundation_thickness_mm: int — foundation concrete thickness T in mm
#   foundation_overlap_mm  : int — actual overlap L at step in mm (§2E2d)
#   foundation_type        : 'strip' or 'trench_fill' — determines overlap formula
#
# OUTPUTS (slots written)
#   stepped_foundation_ok : 'YES'/'NO' — §2E2d-e compliance verdict
#   foundation_violations : str — appended constraint violations
#
# GUARD — EXCEPTION: defined $f->{stepped_foundation_ok}
#   Idempotence — prevents re-processing a Frame already checked in a prior cycle.
##
RULE: R04-a-stepped-foundation
FIND:
  f:
    attribut: besoin_foundation
    filtre: 'defined $_->get("step_height_mm")'
EXCEPTION: defined $f->{stepped_foundation_ok}
ACTION: |
  my @viol = split /;\s*/, ($f->get('foundation_violations') // '');

  my $S    = $f->get('step_height_mm')          // 0;
  my $T    = $f->get('foundation_thickness_mm') // 0;
  my $L    = $f->get('foundation_overlap_mm')   // 0;
  my $ftyp = $f->get('foundation_type')         // 'strip';

  # §2E2e: step height S must not exceed foundation thickness T
  if ($S > 0 && $T > 0 && $S > $T) {
      push @viol, "step height S=${S}mm > foundation thickness T=${T}mm (§2E2e)";
  }

  # §2E2d: minimum overlap L at each step
  if ($L > 0) {
      my $min_L;
      if ($ftyp eq 'trench_fill') {
          # Trench fill: L ≥ max(2×S, 1000mm)
          $min_L = ($S * 2 > 1000) ? $S * 2 : 1000;
          push @viol,
              "stepped trench-fill overlap L=${L}mm < min ${min_L}mm (§2E2d, S=${S}mm)"
              if $L < $min_L;
      } else {
          # Strip foundation: L ≥ max(2×S, T, 300mm)
          $min_L = $S * 2;
          $min_L = $T   if $T   > $min_L;
          $min_L = 300  if 300  > $min_L;
          push @viol,
              "stepped strip overlap L=${L}mm < min ${min_L}mm (§2E2d, S=${S}mm, T=${T}mm)"
              if $L < $min_L;
      }
  }

  my $ok = @viol ? 'NO' : 'YES';
  $f->set('stepped_foundation_ok', $ok);
  $f->set('foundation_violations', join('; ', @viol));

  # Propagate failure to the overall foundation verdict (R03 may have set it to YES,
  # but stepped violations override it)
  $f->set('foundation_ok', 'NO') if $ok eq 'NO';
  1
