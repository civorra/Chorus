##
# RULE: R02-foundation-depth
# AGENT: ADA::Agent::Foundation  (pos. 4 / 4)
# CORPUS: §2E4 — Approved Document A (Structure) 2013 — Minimum depth of strip foundations
#
# PURPOSE
#   Verifies that the depth to the underside of strip foundations meets the §2E4
#   minimum: 0.45m general (frost protection), with higher minimums for shrinkable
#   clays (0.75m low, 0.90m medium, 1.00m high shrinkage class).
#
# INPUTS  (slots read)
#   besoin_foundation  : targeting slot — 'Y'
#   shrink_class       : 'low'/'medium'/'high'/'none' — clay shrinkage per §2E4
#   foundation_depth_m : float — depth to underside of foundation (metres)
#
# OUTPUTS (slots written)
#   foundation_depth_ok : 'YES'/'NO' — §2E4 verdict
#   foundation_violations : updated with depth violation if present
#
# HELPERS
#   min_depth_2e4($shrink_class) → $metres
#
# GUARD — EXCEPTION: defined $f->{foundation_depth_ok}
#   Idempotence.
##
RULE: R02-foundation-depth
FIND:
  f:
    attribut: besoin_foundation
EXCEPTION: defined $f->{foundation_depth_ok}
ACTION: |
  use ADA::Agent::Foundation::Helpers qw(min_depth_2e4);
  my @viol = grep { length $_ } split /;\s*/, ($f->get('foundation_violations') // '');

  my $shrink = $f->get('shrink_class')       // 'none';
  my $depth  = $f->get('foundation_depth_m') // 0;
  my $min_d  = min_depth_2e4($shrink);

  if ($depth < $min_d) {
      push @viol,
          "foundation_depth ${depth}m < min ${min_d}m (§2E4, shrink_class=$shrink)";
      $f->set('foundation_depth_ok', 'NO');
  } else {
      $f->set('foundation_depth_ok', 'YES');
  }

  $f->set('foundation_violations', join('; ', @viol));
  1
