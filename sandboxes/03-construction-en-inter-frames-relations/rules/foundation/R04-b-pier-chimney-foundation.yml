##
# RULE: R05-pier-chimney-foundation
# AGENT: ADA::Agent::Foundation  (pos. 4 / 6)
# CORPUS: §2E2f — Approved Document A 2013 — Foundations
#          Diagram 22 — Piers and chimneys (p.38)
#
# PURPOSE
#   Verifies that strip foundations under piers or chimneys project sufficiently
#   beyond the element per §2E2f / Diagram 22:
#   - Projection X on each side of the pier/chimney must be ≥ P
#     where P is the relevant pier/chimney plan dimension.
#   Fires on external_wall Frames where pier or chimney foundation projection data
#   is provided (pier_projection_x_mm and pier_plan_dim_p_mm).
#
# INPUTS  (slots read)
#   besoin_foundation        : targeting slot — set by Masonry R02
#   pier_projection_x_mm     : actual foundation projection X beyond pier face (mm)
#   pier_plan_dim_p_mm       : pier or chimney plan dimension P (mm) — §2E2f
#
# OUTPUTS (slots written)
#   pier_foundation_ok       : 'YES'/'NO' — projection X ≥ P
#   foundation_violations    : cumulative violation list
#   foundation_ok            : updated to 'NO' on violation (aggregate verdict set by R03)
#
# GUARD — EXCEPTION: defined $w->{pier_foundation_ok}
#   Idempotence — prevents re-processing a Frame already handled in a previous cycle.
##
RULE: pier-chimney-foundation
FIND:
  w:
    attribut: besoin_foundation
    filtre: "defined $_->get('pier_projection_x_mm') && defined $_->get('pier_plan_dim_p_mm')"
EXCEPTION: defined $w->{pier_foundation_ok}
ACTION: |
  my @viol = split /;\s*/, ($w->get('foundation_violations') // '');

  my $x = $w->get('pier_projection_x_mm') // 0;
  my $p = $w->get('pier_plan_dim_p_mm')   // 0;

  # §2E2f / Diagram 22: projection X ≥ P on each side
  if ($p > 0 && $x < $p) {
      push @viol,
          "pier/chimney foundation projection X=${x}mm < P=${p}mm (§2E2f Diagram 22)";
  }

  my $ok = @viol ? 'NO' : 'YES';
  $w->set('pier_foundation_ok',    $ok);
  $w->set('foundation_violations', join('; ', @viol));
  $w->set('foundation_ok', 'NO') if $ok eq 'NO';
  1
