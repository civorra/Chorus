##
# RULE: R01-consequence-class
# AGENT: ADA::Agent::Robustness  (pos. 0 / 5)
# CORPUS: §5.1, Table 11 — UK Approved Document A 2013 — Building consequence classes
#
# PURPOSE
#   Classifies building into Consequence Class CC1/CC2a/CC2b/CC3 per Table 11 (§5.1).
#   CC1  — no additional robustness measures required beyond A1/A2 compliance.
#   CC2a — effective horizontal ties or floor anchorage required.
#   CC2b — horizontal + vertical ties, or key element design, or notional removal check.
#   CC3  — full systematic risk assessment by structural engineer required.
#
# INPUTS  (slots read)
#   type_element           : building type — targeting slot (Strategy A, filter on building_use)
#   building_use           : use category (see robustness.org Aliases)
#   num_storeys_building   : total storeys (basements excl. if meeting CC2b per Note 2)
#   floor_area_m2_storey   : max floor area per storey (m²) — for retail/public thresholds
#
# OUTPUTS (slots written)
#   consequence_class : 'CC1'/'CC2a'/'CC2b'/'CC3'
#   robustness_ok     : 'YES' if CC1 (no extra measures), 'NO' otherwise
#   robustness_note   : description of required measures
#
# GUARD — EXCEPTION: defined $b->{consequence_class}
#   Idempotence — prevents re-processing a Frame already handled.
##
RULE: R01-consequence-class
FIND:
  b:
    attribut: type_element
    filtre: "defined $_->get('building_use')"
EXCEPTION: defined $b->{consequence_class}
ACTION: |
  use ADA::Agent::Robustness::Helpers qw(consequence_class_table11);

  my $use     = $b->get('building_use')          // 'house';
  my $storeys = $b->get('num_storeys_building')  // 1;
  my $area    = $b->get('floor_area_m2_storey')  // 0;

  my ($cc, $note) = consequence_class_table11($use, $storeys, $area);

  $b->set('consequence_class', $cc);
  $b->set('robustness_ok',     ($cc eq 'CC1') ? 'YES' : 'NO');
  $b->set('robustness_note',   $note);
  1
