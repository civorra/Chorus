##
# RULE: R03-annexe-geometry
# AGENT: ADA::Agent::Geometry  (pos. 1 / 4)
# CORPUS: §2C4c — Approved Document A (Structure) 2013 — Annexes
#         §2C14 — Maximum floor area (36m² for open-sided floor)
#         §2C16 — Maximum height of buildings (Diagram 7 Table c)
#
# PURPOSE
#   Verifies geometric constraints for small annexe buildings (garages, outbuildings):
#   H ≤ 3m (flat roof) or H ≤ 4.5m (pitched roof ≤40°), floor area ≤ 36m²,
#   and wind-driven height limit. Sets besoin_wall.
#
# INPUTS  (slots read)
#   type_element      : targeting slot — 'annexe' — set by feed
#   height_m          : float — height H in metres
#   roof_type         : enum  — 'flat' or 'pitched' (default: 'flat')
#   floor_area_m2     : float — floor area in m² (optional)
#   factor_s          : float — wind Factor S (optional)
#   site_type         : enum  — 'country' or 'town' (optional)
#   coast_distance_km : float — distance to coast in km (optional)
#
# OUTPUTS (slots written)
#   max_height_allowed_m : float — 3m (flat) or 4.5m (pitched), or wind limit if lower
#   geometry_violations  : str — violated constraints
#   geometry_ok          : 'YES'/'NO' — overall verdict
#   besoin_wall          : 'Y' — targeting slot for ADA::Agent::Wall
#
# HELPERS
#   max_height_from_table_c($factor_s, $site_type, $coast_km) → $height_m | undef
#
# GUARD — EXCEPTION: defined $b->{geometry_ok}
#   Idempotence.
##
RULE: R03-annexe-geometry
FIND:
  b:
    attribut: type_element
    filtre: '$_->get("type_element") eq "annexe"'
EXCEPTION: defined $b->{geometry_ok}
ACTION: |
  use ADA::Agent::Geometry::Helpers qw(max_height_from_table_c);
  my @violations;

  my $h         = $b->get('height_m')      // 0;
  my $roof_type = $b->get('roof_type')     // 'flat';
  my $area      = $b->get('floor_area_m2') // 0;

  # §2C4c: height limit by roof type
  my $max_h_type = ($roof_type eq 'pitched') ? 4.5 : 3.0;
  push @violations, "height_m > ${max_h_type}m for $roof_type roof (got ${h}m)"
      if $h > $max_h_type;

  # §2C14: floor area ≤ 36m²
  push @violations, "floor_area > 36m2 (got ${area}m2)" if $area > 36;

  # §2C16: wind height limit — apply if more restrictive than type limit
  my $max_h_wind = max_height_from_table_c(
      $b->get('factor_s'), $b->get('site_type'), $b->get('coast_distance_km')
  );
  my $effective_max = $max_h_type;
  if (defined $max_h_wind && $max_h_wind < $max_h_type) {
      push @violations, "height_m > wind_limit (${h}m > ${max_h_wind}m)"
          if $h > $max_h_wind;
      $effective_max = $max_h_wind;
  }

  $b->set('max_height_allowed_m', $effective_max);
  $b->set('geometry_violations',  join('; ', @violations));
  $b->set('geometry_ok',          @violations ? 'NO' : 'YES');
  $b->set('besoin_wall',          'Y');
  1
