##
# RULE: R25-leg-termination
# AGENT: CyberSec::Agent::CertProfileLeg  (pos. 3 / 3)
# CORPUS: (pipeline control — no direct corpus article)
#
# PURPOSE
#   Terminates the full 3-agent pipeline once all LEG frames have leg_profile_result set.
#   Two-rule pattern Rule B: EXCEPTION fmatch + TERMINAL: solved.
#   This is the final rule of the final agent — it ends the pipeline with solved().
#
#   Must run after R24-leg-compute-result (alphabetical load order: R25 > R24).
#
# INPUTS  (slots read)
#   needs_leg_validation : targeting slot — provides the dummy scope variable
#   leg_profile_result   : checked via fmatch in EXCEPTION to detect pending frames
#
# OUTPUTS
#   TERMINAL: solved — ends the pipeline
#
# GUARD — EXCEPTION: fmatch pending check
#   Skipped as long as any LEG frame still lacks leg_profile_result.
#   Once all LEG frames are processed, fires → solved().
##
RULE: R25-leg-termination
TERMINAL: solved
FIND:
  dummy:
    attribut: needs_leg_validation
EXCEPTION: 'scalar(grep { !defined $_->{leg_profile_result} } Chorus::Frame::fmatch(slot => "needs_leg_validation")) > 0'
ACTION: "1"
