##
# RULE: R24-leg-compute-result
# AGENT: CyberSec::Agent::CertProfileLeg  (pos. 3 / 3)
# CORPUS: §4.2.1, §4.3.1 — ETSI EN 319 412-3 V1.3.1 — Overall LEG profile conformance
#
# PURPOSE
#   Aggregates all LEG-specific partial verdicts into a single leg_profile_result (OK / KO).
#   A frame is KO if any checked field is NON.
#   Must run after R22 and R23 (alphabetical load order guarantees this).
#
# INPUTS  (slots read)
#   needs_leg_validation : targeting slot
#   leg_subject_ok       : "OUI"/"NON" — from R22
#   leg_key_usage_ok     : "OUI"/"NON" — from R23
#
# OUTPUTS (slots written)
#   leg_profile_result : "OK" or "KO" — global LEG profile conformance verdict
#
# GUARD — EXCEPTION: defined $f->{leg_profile_result}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R24-leg-compute-result
FIND:
  f:
    attribut: needs_leg_validation
EXCEPTION: 'defined $f->{leg_profile_result}'
ACTION: |
  # Read partial verdicts (undef if rule did not fire — treated as untested, not KO)
  my $subj_ok = $f->get('leg_subject_ok');
  my $ku_ok   = $f->get('leg_key_usage_ok');

  # Aggregate: KO if any checked field is NON
  my $result = 'OK';
  $result = 'KO' if (defined $subj_ok && $subj_ok eq 'NON');
  $result = 'KO' if (defined $ku_ok   && $ku_ok   eq 'NON');

  $f->set('leg_profile_result', $result);
  1
