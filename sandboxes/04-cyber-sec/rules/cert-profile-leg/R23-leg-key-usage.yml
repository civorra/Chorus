##
# RULE: R23-leg-key-usage
# AGENT: CyberSec::Agent::CertProfileLeg  (pos. 3 / 3)
# CORPUS: §4.3.1 — ETSI EN 319 412-3 V1.3.1 — Key usage for legal person certificates
#         LEG-4.3.1-2: Table 1 from ETSI EN 319 412-2 §4.3.2 applies (same 6 combinations A–F)
#         LEG-4.3.1-3: Certificates for evidence of origin/integrity SHALL be type A, B or F
#
# PURPOSE
#   Validates the keyUsage extension for LEG certificates. The valid combinations are
#   identical to NAT (Table 1 from EN 319 412-2). The constraint for evidence-of-origin
#   certificates (eSeals) is analogous to NAT commitment_cert but applied to LEG context.
#
# INPUTS  (slots read)
#   needs_leg_validation     : targeting slot — set by CertProfileCommon R20
#   key_usage_bits           : comma-separated active keyUsage bits (sorted for lookup)
#   evidence_of_origin_cert  : 'Y' if cert is for evidence of origin/integrity (eSeal)
#
# OUTPUTS (slots written)
#   leg_key_usage_ok : "OUI" if combination is valid and constraints are met, "NON" otherwise
#
# GUARD — EXCEPTION: defined $f->{leg_key_usage_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R23-leg-key-usage
FIND:
  f:
    attribut: needs_leg_validation
EXCEPTION: 'defined $f->{leg_key_usage_ok}'
ACTION: |
  my $bits = $f->get('key_usage_bits') // '';

  # Table 1 — ETSI EN 319 412-2 §4.3.2 (applies to LEG via LEG-4.3.1-2)
  my %valid_combos = (
    'nonRepudiation'                                    => 'A',
    'nonRepudiation,digitalSignature'                   => 'B',
    'digitalSignature'                                  => 'C',
    'digitalSignature,keyEncipherment'                  => 'D',
    'digitalSignature,keyAgreement'                     => 'D',
    'keyEncipherment'                                   => 'E',
    'keyAgreement'                                      => 'E',
    'nonRepudiation,digitalSignature,keyEncipherment'   => 'F',
    'nonRepudiation,digitalSignature,keyAgreement'      => 'F',
  );

  # Normalize: sort bits alphabetically for reliable table lookup
  my $key   = join(',', sort split(/,\s*/, $bits));
  my $combo = $valid_combos{$key};
  my $ok    = defined($combo) ? 'OUI' : 'NON';

  # LEG-4.3.1-3: evidence_of_origin_cert (eSeals) must be type A, B or F
  if ($ok eq 'OUI' && ($f->get('evidence_of_origin_cert') // '') eq 'Y') {
    $ok = 'NON' unless ($combo =~ /^[ABF]$/);
  }

  $f->set('leg_key_usage_ok', $ok);
  1
