##
# RULE: R11-revocation-info
# AGENT: CyberSec::Agent::CertProfileNat  (pos. 2 / 2)
# CORPUS: §4.3.11 — ETSI EN 319 412-2 V2.4.1 — CRL distribution points
#          GEN-4.3.11-2:  if no OCSP and no validity_assured → CRL distribution point required
#          GEN-4.3.11-2A: if validity_assured AND no CRL AND no OCSP → NoRevAvail required (RFC 9608)
#          §4.4.1 — Authority Information Access
#          GEN-4.4.1-8:   if no CRL → OCSP required (unless validity_assured)
#          GEN-4.4.1-8A:  if validity_assured AND neither CRL nor OCSP → NoRevAvail required
#
# PURPOSE
#   Validates that a certificate provides adequate revocation information:
#   - CRL distribution point OR OCSP access location must be present, OR
#   - validity_assured AND NoRevocationAvailable extension both present (RFC 9608 exception).
#   Applies to all NAT frames regardless of qualified status.
#
# INPUTS  (slots read)
#   needs_nat_validation : targeting slot — set by CertProfileCommon R04
#   has_crl_dp           : 'Y' if CRL distribution points extension present
#   has_ocsp             : 'Y' if OCSP access location present in AIA extension
#   has_validity_assured : 'Y' if validity assured extension present
#   has_no_rev_avail     : 'Y' if NoRevocationAvailable extension present (RFC 9608)
#
# OUTPUTS (slots written)
#   revocation_ok : "OUI" if revocation info requirement satisfied, "NON" otherwise
#
# GUARD — EXCEPTION: defined $f->{revocation_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R11-revocation-info
FIND:
  f:
    attribut: needs_nat_validation
EXCEPTION: 'defined $f->{revocation_ok}'
ACTION: |
  my $crl    = $f->get('has_crl_dp')          // '';
  my $ocsp   = $f->get('has_ocsp')            // '';
  my $va     = $f->get('has_validity_assured') // '';
  my $no_rev = $f->get('has_no_rev_avail')    // '';

  # GEN-4.3.11-2 / GEN-4.4.1-8: CRL or OCSP required in the general case
  my $ok;
  if ($crl eq 'Y' || $ocsp eq 'Y') {
    # CRL or OCSP present — revocation always conformant (§4.3.11-3/4/5 + §4.4.1)
    $ok = 'OUI';
  } elsif ($va eq 'Y' && $no_rev eq 'Y') {
    # §4.3.11-2A / §4.4.1-8A: validity assured cert with explicit NoRevAvail — conformant
    $ok = 'OUI';
  } else {
    # Neither CRL/OCSP nor valid exception — NON conformant
    $ok = 'NON';
  }

  # Write result
  $f->set('revocation_ok', $ok);
  1
