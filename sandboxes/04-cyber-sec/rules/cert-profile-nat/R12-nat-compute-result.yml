##
# RULE: R12-nat-compute-result
# AGENT: CyberSec::Agent::CertProfileNat  (pos. 2 / 2)
# CORPUS: §4.2.4, §4.3.2, §4.3.3, §4.3.11, §4.4.1, §5.1 — ETSI EN 319 412-2 V2.4.1
#
# PURPOSE
#   Aggregates all NAT-specific partial verdicts into a single nat_profile_result (OK / KO).
#   A frame is KO if any of these slots is NON:
#     nat_subject_ok, nat_key_usage_ok, revocation_ok, cert_policies_ok, qcstatements_ok.
#   Must run after R09–R15 (alphabetical load order guarantees this).
#
# INPUTS  (slots read)
#   needs_nat_validation : targeting slot
#   nat_subject_ok       : "OUI"/"NON" — from R09
#   nat_key_usage_ok     : "OUI"/"NON" — from R10
#   revocation_ok        : "OUI"/"NON" — from R11
#   cert_policies_ok     : "OUI"/"NON" — from R14
#   qcstatements_ok      : "OUI"/"NON" — from R15 (absent on non-qualified frames)
#
# OUTPUTS (slots written)
#   nat_profile_result : "OK" or "KO" — global NAT profile conformance verdict
#
# GUARD — EXCEPTION: defined $f->{nat_profile_result}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R12-nat-compute-result
FIND:
  f:
    attribut: needs_nat_validation
EXCEPTION: 'defined $f->{nat_profile_result}'
ACTION: |
  # Read all partial verdicts (undef if rule did not fire — treated as untested, not KO)
  my $subj_ok = $f->get('nat_subject_ok');
  my $ku_ok   = $f->get('nat_key_usage_ok');
  my $rev_ok  = $f->get('revocation_ok');
  my $cp_ok   = $f->get('cert_policies_ok');
  my $qcs_ok  = $f->get('qcstatements_ok');

  # Aggregate: KO if any checked field is NON
  my $result = 'OK';
  $result = 'KO' if (defined $subj_ok && $subj_ok eq 'NON');
  $result = 'KO' if (defined $ku_ok   && $ku_ok   eq 'NON');
  $result = 'KO' if (defined $rev_ok  && $rev_ok  eq 'NON');
  $result = 'KO' if (defined $cp_ok   && $cp_ok   eq 'NON');   # §4.3.3 cert policies
  $result = 'KO' if (defined $qcs_ok  && $qcs_ok  eq 'NON');   # §5.1 QC only

  # Write global NAT verdict
  $f->set('nat_profile_result', $result);
  1
