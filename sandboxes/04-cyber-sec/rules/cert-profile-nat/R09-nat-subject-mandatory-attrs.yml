##
# RULE: R09-nat-subject-mandatory-attrs
# AGENT: CyberSec::Agent::CertProfileNat  (pos. 2 / 2)
# CORPUS: §4.2.4 — ETSI EN 319 412-2 V2.4.1 — Subject field requirements for NAT certs
#          NAT-4.2.4-1: countryName + (givenName/surname OR pseudonym) + commonName mandatory
#          NAT-4.2.4-3: no more than one instance of commonName and countryName
#          NAT-4.2.4-4: pseudonym shall NOT be present if givenName and/or surname are present
#          NAT-4.2.4-10: if given name is known, givenName attribute shall be present
#          NAT-4.2.4-11: if surname is known, surname attribute shall be present
#
# PURPOSE
#   Validates that the subject field of a natural person certificate contains the mandatory
#   attributes: countryName, commonName, and a valid name identity (givenName/surname OR
#   pseudonym, but not both). Fires on all NAT frames targeted by CertProfileCommon.
#
# INPUTS  (slots read)
#   needs_nat_validation : targeting slot — set by CertProfileCommon R04 on NAT frames
#   has_country_name     : 'Y' if countryName present in subject
#   has_common_name      : 'Y' if commonName present in subject
#   has_given_name       : 'Y' if givenName present in subject
#   has_surname          : 'Y' if surname present in subject
#   has_pseudonym        : 'Y' if pseudonym present in subject
#
# OUTPUTS (slots written)
#   nat_subject_ok : "OUI" if subject attributes conform, "NON" otherwise
#
# GUARD — EXCEPTION: defined $f->{nat_subject_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R09-nat-subject-mandatory-attrs
FIND:
  f:
    attribut: needs_nat_validation
EXCEPTION: 'defined $f->{nat_subject_ok}'
ACTION: |
  # Read subject attribute presence flags
  my $cn      = $f->get('has_common_name')  // '';
  my $country = $f->get('has_country_name') // '';
  my $gn      = $f->get('has_given_name')   // '';
  my $sn      = $f->get('has_surname')      // '';
  my $pseudo  = $f->get('has_pseudonym')    // '';

  my $ok = 'OUI';

  # NAT-4.2.4-1: countryName mandatory
  $ok = 'NON' unless ($country eq 'Y');

  # NAT-4.2.4-1: commonName mandatory
  $ok = 'NON' unless ($cn eq 'Y');

  # NAT-4.2.4-1: name identity — givenName and/or surname OR pseudonym mandatory
  $ok = 'NON' unless (($gn eq 'Y' || $sn eq 'Y') || $pseudo eq 'Y');

  # NAT-4.2.4-4: pseudonym shall not be present if givenName/surname are present
  $ok = 'NON' if ($pseudo eq 'Y' && ($gn eq 'Y' || $sn eq 'Y'));

  # Write result
  $f->set('nat_subject_ok', $ok);
  1
