##
# RULE: R10-nat-key-usage
# AGENT: CyberSec::Agent::CertProfileNat  (pos. 2 / 2)
# CORPUS: §4.3.2 — ETSI EN 319 412-2 V2.4.1 — Key usage extension for NAT certs
#          NAT-4.3.2-1: keyUsage shall be present and contain exactly one combination
#                       from Table 1 (types A–F)
#          NAT-4.3.2-2: commitment certs (signatures) shall be type A, B or F
#          NAT-4.3.2-3: type A recommended for commitment certs (should)
#
# PURPOSE
#   Validates the keyUsage extension against the six valid combinations defined in
#   Table 1. If the certificate is marked as a commitment certificate (used to validate
#   commitment to signed content), only types A, B or F are accepted.
#
# INPUTS  (slots read)
#   needs_nat_validation : targeting slot — set by CertProfileCommon R04
#   key_usage_bits       : str — comma-separated active keyUsage bit names
#   commitment_cert      : 'Y' if cert is used for commitment to signed content
#
# OUTPUTS (slots written)
#   nat_key_usage_ok : "OUI" if keyUsage conforms to Table 1, "NON" otherwise
#
# GUARD — EXCEPTION: defined $f->{nat_key_usage_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R10-nat-key-usage
FIND:
  f:
    attribut: needs_nat_validation
EXCEPTION: 'defined $f->{nat_key_usage_ok}'
ACTION: |
  my $bits = $f->get('key_usage_bits') // '';

  # Table 1 — ETSI EN 319 412-2 §4.3.2 — valid keyUsage combinations
  # Key: sorted comma-separated bit names; Value: type label (A–F)
  my %valid_combos = (
    'nonRepudiation'                                    => 'A',
    'digitalSignature,nonRepudiation'                   => 'B',
    'digitalSignature'                                  => 'C',
    'digitalSignature,keyEncipherment'                  => 'D',
    'digitalSignature,keyAgreement'                     => 'D',
    'keyAgreement'                                      => 'E',
    'keyEncipherment'                                   => 'E',
    'digitalSignature,keyAgreement,nonRepudiation'      => 'F',
    'digitalSignature,keyEncipherment,nonRepudiation'   => 'F',
  );

  # Normalize: sort bits alphabetically for reliable hash key lookup
  my $key   = join(',', sort split(/,\s*/, $bits));
  my $combo = $valid_combos{$key};

  my $ok = defined($combo) ? 'OUI' : 'NON';

  # NAT-4.3.2-2: commitment cert → only type A, B or F allowed
  if ($ok eq 'OUI' && ($f->get('commitment_cert') // '') eq 'Y') {
    $ok = 'NON' unless ($combo =~ /^[ABF]$/);
  }

  # Write result
  $f->set('nat_key_usage_ok', $ok);
  1
