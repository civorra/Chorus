##
# RULE: R13-nat-handoff
# AGENT: CyberSec::Agent::CertProfileNat  (pos. 2 / 3)
# CORPUS: (pipeline control — no direct corpus article)
#
# PURPOSE
#   Handoff rule — fires when ALL NatCert frames have nat_profile_result set,
#   then passes control to CertProfileLeg (agent 3) via $SELF->last().
#   Sets BOARD->{nat_handoff_done} = 'Y' to prevent re-firing on subsequent
#   Expert outer-loop cycles.
#   Converted from TERMINAL: solved to last() after corpus 003 added agent 3.
#
#   Uses fmatch in EXCEPTION (safe) — NOT in ACTION (would cause an infinite loop).
#   Must run after R12-nat-compute-result (alphabetical: R13 > R12).
#
# INPUTS  (slots read)
#   needs_nat_validation : targeting slot — provides the dummy scope variable
#   nat_profile_result   : checked via fmatch in EXCEPTION to detect pending frames
#
# OUTPUTS
#   BOARD->{nat_handoff_done} — set to 'Y' on first firing (idempotence guard)
#   $SELF->last() — passes control to CertProfileLeg (agent 3)
#
# GUARD — EXCEPTION: BOARD flag OR fmatch pending check
#   Skipped if handoff already done (BOARD flag set) OR if any NatCert frame
#   still lacks nat_profile_result.
##
RULE: R13-nat-handoff
FIND:
  dummy:
    attribut: needs_nat_validation
EXCEPTION: 'do { my ($ctrl) = Chorus::Frame::fmatch(slot => "pipeline_ctrl"); $ctrl && defined $ctrl->{nat_handoff_done} } || scalar(grep { !defined $_->{nat_profile_result} } Chorus::Frame::fmatch(slot => "needs_nat_validation")) > 0'
ACTION: |
  # Mark handoff as done on the pipeline control frame — prevents re-firing
  my ($ctrl) = Chorus::Frame::fmatch(slot => 'pipeline_ctrl');
  $ctrl->set('nat_handoff_done', 'Y') if $ctrl;
  # All NAT frames processed — pass control to CertProfileLeg (agent 3)
  $SELF->last();
  1
