##
# RULE: R15-qcstatements
# AGENT: CyberSec::Agent::CertProfileNat  (pos. 2 / 2)
# CORPUS: §5.1 — ETSI EN 319 412-2 V2.4.1 — EU QCStatements
#          QCS-5.1-1: If certificates are issued as EU Qualified Certificates, they SHALL
#                     include QCStatements in accordance with ETSI EN 319 412-5
#
# PURPOSE
#   When a certificate is flagged as an EU Qualified Certificate (is_qualified = 'Y'),
#   validates that the QCStatements extension is present (has_qcstatements = 'Y').
#   Silently skips non-qualified certificates (is_qualified absent or not 'Y').
#
# INPUTS  (slots read)
#   needs_nat_validation : targeting slot — set by CertProfileCommon R04
#   is_qualified         : 'Y' if certificate is an EU Qualified Certificate
#   has_qcstatements     : 'Y' if QCStatements extension present
#
# OUTPUTS (slots written)
#   qcstatements_ok : "OUI" if QCStatements present (or cert not qualified), "NON" if
#                     cert is qualified but QCStatements missing
#
# GUARD — EXCEPTION: defined $f->{qcstatements_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R15-qcstatements
FIND:
  f:
    attribut: needs_nat_validation
EXCEPTION: 'defined $f->{qcstatements_ok}'
ACTION: |
  my $qualified = $f->get('is_qualified') // '';

  # Rule only applies to EU Qualified Certificates — skip non-qualified silently
  unless ($qualified eq 'Y') {
    return 0;
  }

  # QCS-5.1-1: EU QC SHALL include QCStatements per ETSI EN 319 412-5
  my $qcs = $f->get('has_qcstatements') // '';
  my $ok  = ($qcs eq 'Y') ? 'OUI' : 'NON';

  $f->set('qcstatements_ok', $ok);
  1
