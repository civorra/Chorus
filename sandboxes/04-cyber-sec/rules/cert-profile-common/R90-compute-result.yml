##
# RULE: R90-compute-result
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §4.2.1, §4.2.5, §4.3.1, §4.3.3, §4.3.4/8/9/12, §4.3.5, §4.4.1, §5.1.3, §5.1.4, §5.2.2
#         ETSI EN 319 412-1 V1.7.1 + ETSI EN 319 412-2 V2.4.1 — Overall profile conformance
#         ETSI EN 319 412-4 V1.4.1 §4.3 — QEVCP-w OID for WEB EU QC (R41)
#         ETSI EN 319 412-5 V2.6.1 §4.1/§5 — QCStatements content validation + QcType (R39)
#         ETSI EN 319 411-2 V2.6.1 §5.3/§6.6.1 — QC policy OID + QSCD statement check
#
# PURPOSE
#   Aggregates all partial conformance verdicts into a single cert_profile_result (OK / KO)
#   per SubjectIdentifier frame. A frame is KO if any checked field returned NON.
#   Verdicts aggregated (corpus 001 + 002 + 004 + 005 + 008 + 009):
#     serial_number_format_ok, org_id_format_ok, nra_uri_ok, ntr_euid_ok,
#     cert_version_ok, aki_ok, forbidden_exts_ok, aia_ok, web_qcs_ok,
#     qcs_not_critical_ok, qcs_compliance_ok, qcs_cclegislation_ok,
#     qc_policy_oid_ok, qcs_qscd_ok, pk_algorithm_ok, sig_suite_ok,
#     qcs_type_ok.
#   Renamed R20→R30→R34→R90 to load AFTER R36/R37 (alphabetical order).
#   Must run after R01–R37 (load order guaranteed by R90 > R37 alphabetically).
#   Sets needs_nat_validation on NAT frames → triggers CertProfileNat (agent 2).
#   Sets needs_leg_validation on LEG frames → triggers CertProfileLeg (agent 3).
#
# INPUTS  (slots read)
#   needs_cert_validation    : targeting slot — set by Feed.pm
#   type_element             : enum — filtre excludes cert_ext frames
#   serial_number_format_ok  : "OUI"/"NON" (optional — NAT frames only)
#   org_id_format_ok         : "OUI"/"NON" (optional — LEG frames only)
#   nra_uri_ok               : "OUI"/"NON" (optional — local scheme only)
#   ntr_euid_ok              : "OUI"/"NON" (optional — NTR EUID only)
#   cert_version_ok          : "OUI"/"NON" (optional — when cert_version provided)
#   aki_ok                   : "OUI"/"NON" — all frames
#   forbidden_exts_ok        : "OUI"/"NON" — all frames
#   aia_ok                   : "OUI"/"NON" — all frames
#   web_qcs_ok               : "OUI"/"NON" (optional — WEB EU Qualified frames only)
#   qcs_not_critical_ok      : "OUI"/"NON" (optional — EU Qualified frames only)
#   qcs_compliance_ok        : "OUI"/"NON" (optional — EU Qualified frames only)
#   qcs_cclegislation_ok     : "OUI"/"NON" (optional — EU Qualified frames only)
#   qc_policy_oid_ok         : "OUI"/"NON" (optional — EU Qualified frames, cert_policy_oid set)
#   qcs_qscd_ok              : "OUI"/"NON" (optional — EU Qualified frames, cert_policy_oid + has_qcs_qscd set)
#   qcs_type_ok              : "OUI"/"NON" (optional — EU Qualified LEG/WEB frames only)
#   pk_key_size              : integer — key size in bits (set by Feed.pm; R39 input)
#   has_san                  : 'Y' if subjectAltName extension present (R40 input)
#   san_critical             : 'Y' if subjectAltName extension is marked critical (R40 input)
#
# OUTPUTS (slots written)
#   cert_profile_result  : "OK" or "KO" — global conformance verdict for this frame
#   needs_nat_validation : set on NAT frames only — targeting slot for CertProfileNat (agent 2)
#   needs_leg_validation : set on LEG frames only — targeting slot for CertProfileLeg (agent 3)
#
# GUARD — EXCEPTION: defined $f->{cert_profile_result}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R90-compute-result
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: 'defined $f->{cert_profile_result}'
ACTION: |
  # Corpus 001 verdicts (serial/org-id format, NRA URI, NTR EUID)
  my $sn_ok   = $f->get('serial_number_format_ok');
  my $oid_ok  = $f->get('org_id_format_ok');
  my $nra_ok  = $f->get('nra_uri_ok');
  my $ntr_ok  = $f->get('ntr_euid_ok');
  # Corpus 002 verdicts (version, AKI, forbidden extensions, AIA)
  my $ver_ok  = $f->get('cert_version_ok');
  my $aki_ok  = $f->get('aki_ok');
  my $fext_ok = $f->get('forbidden_exts_ok');
  my $aia_ok  = $f->get('aia_ok');
  # Corpus 004 verdict (WEB EU Qualified QCStatements)
  my $wqcs_ok  = $f->get('web_qcs_ok');
  # Corpus 005 verdicts (QCStatements content — EU Qualified certs)
  my $qnc_ok   = $f->get('qcs_not_critical_ok');
  my $qco_ok   = $f->get('qcs_compliance_ok');
  my $qcc_ok   = $f->get('qcs_cclegislation_ok');
  my $qtp_ok   = $f->get('qcs_type_ok');
  # Corpus 008 verdicts (QC policy OID + QSCD statement — EU Qualified certs)
  my $qpo_ok   = $f->get('qc_policy_oid_ok');
  my $qscd_ok  = $f->get('qcs_qscd_ok');
  # Corpus 009 verdicts (subject public key algorithm + signature suite — TS 119 312)
  my $pk_ok    = $f->get('pk_algorithm_ok');
  my $sig_ok   = $f->get('sig_suite_ok');
  # New verdicts (R39 pk-key-size / R40 san-not-critical / R41 web-qevcp-oid)
  my $pksz_ok  = $f->get('pk_key_size_ok');
  my $san_ok   = $f->get('san_not_critical_ok');
  my $wqev_ok  = $f->get('web_qevcp_ok');

  # Aggregate: KO if any checked field is NON
  my $result = 'OK';
  $result = 'KO' if (defined $sn_ok   && $sn_ok   eq 'NON');
  $result = 'KO' if (defined $oid_ok  && $oid_ok  eq 'NON');
  $result = 'KO' if (defined $nra_ok  && $nra_ok  eq 'NON');
  $result = 'KO' if (defined $ntr_ok  && $ntr_ok  eq 'NON');
  $result = 'KO' if (defined $ver_ok  && $ver_ok  eq 'NON');
  $result = 'KO' if (defined $aki_ok  && $aki_ok  eq 'NON');
  $result = 'KO' if (defined $fext_ok && $fext_ok eq 'NON');
  $result = 'KO' if (defined $aia_ok  && $aia_ok  eq 'NON');
  $result = 'KO' if (defined $wqcs_ok && $wqcs_ok eq 'NON');
  $result = 'KO' if (defined $qnc_ok  && $qnc_ok  eq 'NON');
  $result = 'KO' if (defined $qco_ok  && $qco_ok  eq 'NON');
  $result = 'KO' if (defined $qcc_ok  && $qcc_ok  eq 'NON');
  $result = 'KO' if (defined $qtp_ok  && $qtp_ok  eq 'NON');
  $result = 'KO' if (defined $qpo_ok  && $qpo_ok  eq 'NON');
  $result = 'KO' if (defined $qscd_ok && $qscd_ok eq 'NON');
  $result = 'KO' if (defined $pk_ok   && $pk_ok   eq 'NON');
  $result = 'KO' if (defined $sig_ok  && $sig_ok  eq 'NON');
  # pk_key_size_ok: '-' means fixed-size/PQC — never NON, skip
  $result = 'KO' if (defined $pksz_ok && $pksz_ok eq 'NON');
  $result = 'KO' if (defined $san_ok  && $san_ok  eq 'NON');
  $result = 'KO' if (defined $wqev_ok && $wqev_ok eq 'NON');

  # Write global verdict
  $f->set('cert_profile_result', $result);

  # Set targeting slot for CertProfileNat (agent 2) on NAT frames only
  $f->set('needs_nat_validation', 'Y') if ($f->get('type_element') // '') eq 'nat';
  # Set targeting slot for CertProfileLeg (agent 3) on LEG frames only
  $f->set('needs_leg_validation', 'Y') if ($f->get('type_element') // '') eq 'leg';
  1

