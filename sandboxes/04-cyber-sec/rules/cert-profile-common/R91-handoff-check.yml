##
# RULE: R91-handoff-check
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: (pipeline control — no direct corpus article)
#
# PURPOSE
#   Handoff guard: confirms that all non-cert_ext frames have cert_profile_result set,
#   then passes control to CertProfileNat (agent 2) via $SELF->last().
#   Sets BOARD->{certcommon_handoff_done} = 'Y' to prevent re-firing on subsequent
#   Expert outer-loop cycles (without this guard, last() only exits the current agent
#   loop but the Expert re-invokes loop() on the next iteration, causing the rule to
#   fire indefinitely until _MAX_CYCLES is reached).
#
#   Renamed R21→R31→R35→R91 to load AFTER R36/R37/R90 (alphabetical: R91 > R90 > R37).
#   Must run after R90 (alphabetical: R91 > R90).
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — provides the dummy scope variable
#   cert_profile_result   : checked via fmatch in EXCEPTION to detect pending frames
#
# OUTPUTS
#   BOARD->{certcommon_handoff_done} — set to 'Y' on first firing (idempotence guard)
#   $SELF->last() — passes control to CertProfileNat (agent 2)
#
# GUARD — EXCEPTION: BOARD flag OR fmatch pending check
#   Skipped if handoff already done (BOARD flag set) OR if any non-cert_ext frame
#   still lacks cert_profile_result.
##
RULE: R91-handoff-check
FIND:
  dummy:
    attribut: needs_cert_validation
EXCEPTION: 'do { my ($ctrl) = Chorus::Frame::fmatch(slot => "pipeline_ctrl"); $ctrl && defined $ctrl->{certcommon_handoff_done} } || scalar(grep { !defined $_->{cert_profile_result} && $_->get("type_element") ne "cert_ext" } Chorus::Frame::fmatch(slot => "needs_cert_validation")) > 0'
ACTION: |
  # Mark handoff as done on the pipeline control frame — prevents re-firing
  my ($ctrl) = Chorus::Frame::fmatch(slot => 'pipeline_ctrl');
  $ctrl->set('certcommon_handoff_done', 'Y') if $ctrl;
  # All non-cert_ext frames have cert_profile_result — pass control to CertProfileNat
  $SELF->last();
  1
