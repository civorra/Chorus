##
# RULE: R39-pk-key-size
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §4.2.5 — ETSI EN 319 412-2 V2.4.1 — Subject public key info
#          GEN-4.2.5-1: the subjectPublicKeyInfo field shall contain a key of at least
#          the minimum size defined in ETSI TS 119 312 (referenced via §6.2 Table 2 /
#          §10.2.4 Table 13 — minimum key sizes per algorithm family).
#
# PURPOSE
#   Validates that the subject public key size meets the minimum threshold required by
#   ETSI TS 119 312 for the declared algorithm:
#     RSA / DSA           → pk_key_size ≥ 2048 bits  (R: ≥ 3072; L: ≥ 2048)
#     ECDSA (id-ecPublicKey) → pk_key_size ≥ 256 bits (P-256 / P-384 / P-521)
#     Ed25519 (1.3.101.112)  → fixed size 256 bits — always passes size check
#     Ed448   (1.3.101.113)  → fixed size 448 bits — always passes size check
#     ML-DSA / SLH-DSA       → PQC algorithms — size encoded in OID; always passes
#
#   Silently skips frames without pk_algorithm_oid or pk_key_size.
#   Relies on R36-pk-algorithm having already verified the OID is approved;
#   this rule adds the key-size dimension independently.
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot
#   pk_algorithm_oid      : OID string of the subject public key algorithm
#   pk_key_size           : integer — key size in bits (set by Feed.pm; e.g. 2048, 256, 384)
#
# OUTPUTS (slots written)
#   pk_key_size_ok : OUI  — key size meets minimum threshold for the declared algorithm
#                   NON  — key size is below minimum
#                   '-'  — algorithm has fixed size or is PQC (OID encodes params); not applicable
#
# GUARD — EXCEPTION: defined $f->{pk_key_size_ok}
##
RULE: R39-pk-key-size
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: defined $f->{pk_key_size_ok}
ACTION: |
  my $oid  = $f->get('pk_algorithm_oid');
  my $size = $f->get('pk_key_size');

  # Skip silently if either slot is absent
  return 0 unless defined $oid && length $oid;
  return 0 unless defined $size && $size > 0;

  # Fixed-size / PQC algorithms: size check not applicable — always compliant
  my %fixed_size_oids = map { $_ => 1 } qw(
    1.3.101.112
    1.3.101.113
    2.16.840.1.101.3.4.3.17
    2.16.840.1.101.3.4.3.18
    2.16.840.1.101.3.4.3.19
    2.16.840.1.101.3.4.3.22
    2.16.840.1.101.3.4.3.23
    2.16.840.1.101.3.4.3.24
    2.16.840.1.101.3.4.3.25
    2.16.840.1.101.3.4.3.28
    2.16.840.1.101.3.4.3.29
    2.16.840.1.101.3.4.3.30
    2.16.840.1.101.3.4.3.31
  );
  if ($fixed_size_oids{$oid}) {
    $f->set('pk_key_size_ok', '-');
    return 1;
  }

  # RSA (1.2.840.113549.1.1.1) and DSA (1.2.840.10040.4.1): minimum 2048 bits
  # TS 119 312 §6.2 T2: L status for 2048-3071 (accepted); R status for ≥ 3072
  if ($oid eq '1.2.840.113549.1.1.1' || $oid eq '1.2.840.10040.4.1') {
    $f->set('pk_key_size_ok', ($size >= 2048) ? 'OUI' : 'NON');
    return 1;
  }

  # ECDSA / id-ecPublicKey (1.2.840.10045.2.1): minimum 256 bits (P-256)
  # TS 119 312 §6.2 T2: P-256 (256), P-384 (384), P-521 (521) all approved
  if ($oid eq '1.2.840.10045.2.1') {
    $f->set('pk_key_size_ok', ($size >= 256) ? 'OUI' : 'NON');
    return 1;
  }

  # Unknown approved OID with a declared key size: apply conservative 2048-bit floor
  $f->set('pk_key_size_ok', ($size >= 2048) ? 'OUI' : 'NON');
  1
