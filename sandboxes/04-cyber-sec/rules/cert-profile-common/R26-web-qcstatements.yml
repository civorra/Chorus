##
# RULE: R26-web-qcstatements
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §4.2 — ETSI EN 319 412-4 V1.4.1 (2025-06) — EU Qualified Certificate statements
#         QCS-4.2-1: When certificates are issued as EU Qualified Certificates, they shall
#         include QCStatements as specified in clauses 4 and 5 of ETSI EN 319 412-5.
#
# PURPOSE
#   Validates that EU Qualified web site certificates include QCStatements.
#   Applies to frames with type_element = "web" only (NAT is handled by R15 in
#   CertProfileNat; LEG QC check is also covered there via cert-profile-nat's R15
#   which applies when needs_nat_validation is set — but WEB frames never reach
#   CertProfileNat, so this rule fills the gap for WEB qualified certs).
#   Silently skips non-qualified WEB frames (is_qualified absent or not 'Y').
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   type_element          : enum — filtre restricts to "web" frames only
#   is_qualified          : 'Y' if the certificate is an EU Qualified Certificate
#   has_qcstatements      : 'Y' if QCStatements extension is present
#
# OUTPUTS (slots written)
#   web_qcs_ok : "OUI" if QCStatements present (or frame not qualified), "NON" if qualified but absent
#
# GUARD — EXCEPTION: defined $f->{web_qcs_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R26-web-qcstatements
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") eq "web"'
EXCEPTION: 'defined $f->{web_qcs_ok}'
ACTION: |
  # Only check QCStatements when is_qualified = 'Y'
  unless (($f->get('is_qualified') // '') eq 'Y') { return 0; }

  # QCS-4.2-1: EU Qualified web certificates shall include QCStatements
  my $qcs = $f->get('has_qcstatements') // '';
  $f->set('web_qcs_ok', ($qcs eq 'Y') ? 'OUI' : 'NON');
  1
