##
# RULE: R40-san-not-critical
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §4.3.5 — ETSI EN 319 412-2 V2.4.1 — Subject alternative name
#          GEN-4.3.5-1 (part a): if the subjectAltName extension is present,
#          it shall NOT be marked as critical.
#
# NOTE: GEN-4.3.5-1 (part b) — RFC 822 email address should correspond to the
#       subject's identity — is a SHOULD, not a SHALL, and requires semantic
#       cross-validation outside the scope of structural rule encoding.
#       ⏭ DEFERRED: part (b) is intentionally excluded from this rule.
#       It may be addressed in a future chorus-feed --enrich cycle if needed.
#
# PURPOSE
#   Validates that, when the subjectAltName (SAN) extension is present, it is not
#   marked as critical. A critical SAN in an end-entity certificate with a non-empty
#   Subject field is a RFC 5280 violation and a non-conformance per GEN-4.3.5-1.
#
#   Silently skips frames where has_san is absent or not 'Y' (SAN not present).
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot
#   has_san               : 'Y' if subjectAltName extension is present
#   san_critical          : 'Y' if subjectAltName extension is marked critical
#
# OUTPUTS (slots written)
#   san_not_critical_ok : OUI — SAN absent or present and not critical (conformant)
#                         NON — SAN present and marked critical (non-conformant)
#
# GUARD — EXCEPTION: defined $f->{san_not_critical_ok}
##
RULE: R40-san-not-critical
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: defined $f->{san_not_critical_ok}
ACTION: |
  # Skip silently if SAN is not present — rule only applies when SAN exists
  my $has_san = $f->get('has_san') // '';
  unless ($has_san eq 'Y') { return 0; }

  # §4.3.5 GEN-4.3.5-1(a): SAN SHALL NOT be critical
  my $critical = $f->get('san_critical') // '';
  $f->set('san_not_critical_ok', ($critical eq 'Y') ? 'NON' : 'OUI');
  1
