##
# RULE: R28-qcs-compliance-present
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §5 Table 2 — ETSI EN 319 412-5 V2.6.1 — esi4-qcStatement-1 presence: M
#
# PURPOSE
#   For EU Qualified Certificates, id-etsi-qcs-QcCompliance (esi4-qcStatement-1)
#   SHALL be present in the qcStatements extension (Table 2: M — Mandatory).
#   Silently skips non-qualified frames.
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   is_qualified          : 'Y' if EU Qualified Certificate
#   has_qcs_compliance    : 'Y' if id-etsi-qcs-QcCompliance present
#
# OUTPUTS (slots written)
#   qcs_compliance_ok     : OUI if present, NON if absent
#
# GUARD — EXCEPTION: defined $f->{qcs_compliance_ok}
##
RULE: qcs-compliance-present
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: defined $f->{qcs_compliance_ok}
ACTION: |
  # Only applies to EU Qualified Certificates
  unless (($f->get('is_qualified') // '') eq 'Y') { return 0; }
  # §5 Table 2: esi4-qcStatement-1 (QcCompliance) — Presence: M (Mandatory)
  my $compliance = $f->get('has_qcs_compliance') // '';
  $f->set('qcs_compliance_ok', ($compliance eq 'Y') ? 'OUI' : 'NON');
  1
