##
# RULE: R32-qc-policy-oid
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §5.3 + §6.6.1 GEN-6.6.1-05 — ETSI EN 319 411-2 V2.6.1 — QC Policy OID
#          Cross-ref: §5.2 — ETSI EN 319 412-2 V2.4.1 (same requirement — EU QC certPolicies OID)
#
# PURPOSE
#   For EU Qualified Certificates, the certificate SHALL include at least one of the
#   7 standardized QCP/QNCP policy identifiers defined in §5.3 of EN 319 411-2.
#   Verifies that cert_policy_oid is one of:
#     0.4.0.194112.1.0  — qcp-natural      (QCP-n)
#     0.4.0.194112.1.1  — qcp-legal        (QCP-l)
#     0.4.0.194112.1.2  — qcp-natural-qscd (QCP-n-qscd)
#     0.4.0.194112.1.3  — qcp-legal-qscd   (QCP-l-qscd)
#     0.4.0.194112.1.4  — qcp-web          (QEVCP-w)
#     0.4.0.194112.1.5  — qncp-web         (QNCP-w)
#     0.4.0.194112.1.6  — qncp-web-gen     (QNCP-w-gen)
#   Silently skips non-qualified frames or frames without cert_policy_oid.
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   is_qualified          : 'Y' if EU Qualified Certificate
#   cert_policy_oid       : OID string of the certificate policy present in the cert
#
# OUTPUTS (slots written)
#   qc_policy_oid_ok      : OUI if cert_policy_oid is a valid QCP/QNCP OID, NON otherwise
#
# GUARD — EXCEPTION: defined $f->{qc_policy_oid_ok}
##
RULE: qc-policy-oid
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: defined $f->{qc_policy_oid_ok}
ACTION: |
  # Only applies to EU Qualified Certificates
  unless (($f->get('is_qualified') // '') eq 'Y') { return 0; }
  # Only if cert_policy_oid is provided
  my $oid = $f->get('cert_policy_oid');
  return 0 unless defined $oid && length $oid;
  # §5.3: 7 valid QCP/QNCP policy OIDs (itu-t.4.0.194112.1.0-6)
  my %valid_oids = map { $_ => 1 } qw(
    0.4.0.194112.1.0
    0.4.0.194112.1.1
    0.4.0.194112.1.2
    0.4.0.194112.1.3
    0.4.0.194112.1.4
    0.4.0.194112.1.5
    0.4.0.194112.1.6
  );
  $f->set('qc_policy_oid_ok', $valid_oids{$oid} ? 'OUI' : 'NON');
  1
