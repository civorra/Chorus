##
# RULE: R01-nat-serial-format
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 1)
# CORPUS: §5.1.3 — ETSI EN 319 412-1 V1.7.1 — Natural person semantics identifier
#          NAT-5.1.3-02: serialNumber structure: <type_ref><country>-<id>
#          NAT-5.1.3-03: accepted type references: PAS, IDC, PNO, TAX, TIN, EID, or 2-char local + ":"
#
# PURPOSE
#   Validates the format of the serialNumber attribute for natural person certificates.
#   Only fires on frames where type_element = "nat".
#   Checks that the value follows: <3-char type ref><2-char ISO country>-<identifier>
#   or the local-scheme variant: <2-char>:<2-char ISO country>-<identifier>.
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm at frame creation
#   type_element          : enum (nat/leg/web/gen) — filtre restricts to "nat" only
#   serial_number         : str — serialNumber X.509 attribute value to validate
#
# OUTPUTS (slots written)
#   serial_number_format_ok : "OUI" if format is valid, "NON" otherwise
#
# GUARD — EXCEPTION: defined $f->{serial_number_format_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R01-nat-serial-format
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") eq "nat"'
CONDITION: 'defined $f->get("serial_number")'
EXCEPTION: 'defined $f->{serial_number_format_ok}'
ACTION: |
  # Read serial number value
  my $sn = $f->get('serial_number');

  # §5.1.3 NAT-5.1.3-02 + NAT-5.1.3-03: validate structure
  # Standard form: <PAS|IDC|PNO|TAX|TIN|EID><XX>-<id>
  # Local scheme:  <2-char>:<XX>-<id>   (NAT-5.1.3-07: unique within NRA URI context)
  my $ok = ($sn =~ /^(?:PAS|IDC|PNO|TAX|TIN|EID)[A-Z]{2}-\S+$/
         || $sn =~ /^[A-Z]{2}:[A-Z]{2}-\S+$/) ? 'OUI' : 'NON';

  # Write result
  $f->set('serial_number_format_ok', $ok);
  1
