##
# RULE: R16-gen-cert-version
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 2)
# CORPUS: §4.2.1 — ETSI EN 319 412-2 V2.4.1 — Basic certificate fields: Version
#
# PURPOSE
#   Validates that the certificate version is V3 as required by GEN-4.2.1-1.
#   The X.509 V3 version is encoded as integer value 2 in DER; some project files
#   may supply 'v3', '3', or '2' — all are accepted as equivalent.
#   Applies to all SubjectIdentifier frames (nat / leg / web / gen).
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   cert_version          : string — certificate version ('v3', '3', or '2' expected)
#
# OUTPUTS (slots written)
#   cert_version_ok : "OUI" if version is V3, "NON" otherwise
#
# GUARD — EXCEPTION: defined $f->{cert_version_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R16-gen-cert-version
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
CONDITION: 'defined $f->get("cert_version")'
EXCEPTION: 'defined $f->{cert_version_ok}'
ACTION: |
  # §4.2.1 GEN-4.2.1-1: version shall be V3 (DER integer 2)
  # Accept: 'v3', '3', or '2' (case-insensitive)
  my $ver = lc($f->get('cert_version') // '');
  my $ok = ($ver =~ /^(?:v3|3|2)$/) ? 'OUI' : 'NON';
  $f->set('cert_version_ok', $ok);
  1
