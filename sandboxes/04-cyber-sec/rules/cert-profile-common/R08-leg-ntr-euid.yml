##
# RULE: R08-leg-ntr-euid
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 1)
# CORPUS: §5.1.4 — ETSI EN 319 412-1 V1.7.1 — Legal person semantics identifier
#          LEG-5.1.4-07 option b: NTR using EUID sub-structure (Business Registers
#          Interconnection System) — format: <BRI>.<BRN>
#          Example: "DED2601V.HRB12345" (Amtsgericht München)
#          Implementing Regulation (EU) 2021/1042 §8 defines BRI and BRN
#
# PURPOSE
#   For NTR legal person identifiers that use the EUID Business Register sub-structure
#   (identified by a "." separator within the identifier part), validates that both the
#   Business Register Identifier (BRI) and Business Registration Number (BRN) are present
#   and non-empty. Only fires on LEG frames with NTR prefix AND a dot in the identifier.
#   Silently skips NTR identifiers using the plain national identifier (no dot).
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm at frame creation
#   type_element          : enum — filtre restricts to "leg" only
#   org_id                : str — NTR identifier; must contain "." for this rule to fire
#
# OUTPUTS (slots written)
#   ntr_euid_ok : "OUI" if BRI.BRN format is valid (both parts non-empty), "NON" otherwise
#
# GUARD — EXCEPTION: defined $f->{ntr_euid_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R08-leg-ntr-euid
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") eq "leg"'
CONDITION: 'defined $f->get("org_id")'
EXCEPTION: 'defined $f->{ntr_euid_ok}'
ACTION: |
  my $oid = $f->get('org_id') // '';

  # Only applies to NTR identifiers using EUID sub-structure (dot notation)
  # Plain national identifier (NTR without dot) is also valid — skip silently
  unless ($oid =~ /^NTR[A-Z]{2}-/ && $oid =~ /\./) {
    return 0;  # not NTR or no EUID dot-notation; skip silently
  }

  # §5.1.4 LEG-5.1.4-07 option b:
  # Format: NTR<CC>-<BRI>.<BRN>
  # Both BRI and BRN must be non-empty strings
  my ($id_part) = $oid =~ /^NTR[A-Z]{2}-(.+)$/;
  my $ok = 'NON';
  if (defined $id_part && $id_part =~ /^(\S+)\.(\S+)$/) {
    # Both BRI ($1) and BRN ($2) are non-empty — §5.1.4 LEG-5.1.4-07 option b satisfied
    $ok = 'OUI';
  }

  $f->set('ntr_euid_ok', $ok);
  1
