##
# RULE: R07-leg-nra-uri
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 1)
# CORPUS: §5.1.4 — ETSI EN 319 412-1 V1.7.1 — Legal person semantics identifier
#          LEG-5.1.4-05: nameRegistrationAuthorities shall be present when local scheme used,
#                        and shall contain at least a uniformResourceIdentifier generalName
#          LEG-5.1.4-06: 2-letter type reference shall be unique within NRA URI context
#
# PURPOSE
#   When a legal person organizationIdentifier uses a locally-defined identity type reference
#   (2-char prefix followed by ":"), the nameRegistrationAuthorities element MUST be present.
#   Only fires on LEG frames where org_id contains the local scheme marker ":".
#   Silently skips standard-scheme identifiers (VAT, NTR, PSD, LEI, EOR, EXC).
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm at frame creation
#   type_element          : enum — filtre restricts to "leg" only
#   org_id                : str — checked for local scheme marker ":"
#   name_reg_authority    : str URI — nameRegistrationAuthorities value
#
# OUTPUTS (slots written)
#   nra_uri_ok : "OUI" if NRA URI is present, "NON" if absent (required but missing)
#
# GUARD — EXCEPTION: defined $f->{nra_uri_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
#   Note: nra_uri_ok is shared with R06 (natural person); EXCEPTION guards both.
##
RULE: R07-leg-nra-uri
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") eq "leg"'
CONDITION: 'defined $f->get("org_id")'
EXCEPTION: 'defined $f->{nra_uri_ok}'
ACTION: |
  my $oid = $f->get('org_id') // '';

  # Only applies when a locally-defined identity scheme is used (2-char + ":")
  # Standard schemes (VAT, NTR, PSD, LEI, EOR, EXC) do not require NRA URI
  unless ($oid =~ /^[A-Z]{2}:/) {
    return 0;  # standard scheme — NRA not required; skip silently
  }

  # §5.1.4 LEG-5.1.4-05: nameRegistrationAuthorities shall be present
  # and shall contain at least a uniformResourceIdentifier generalName
  my $nra = $f->get('name_reg_authority');
  my $ok  = (defined $nra && $nra =~ /\S/) ? 'OUI' : 'NON';

  $f->set('nra_uri_ok', $ok);
  1
