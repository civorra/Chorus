##
# RULE: R19-gen-aia
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 2)
# CORPUS: §4.4.1 — ETSI EN 319 412-2 V2.4.1 — Authority Information Access
#
# PURPOSE
#   Validates that the Authority Information Access (AIA) extension is present per
#   GEN-4.4.1-2: "The Authority Information Access extension shall be present."
#   Applies to all SubjectIdentifier frames (nat / leg / web / gen).
#   Note: GEN-4.4.1-1 exempts OCSP responder certificates — not in scope here.
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   has_aia               : 'Y' if AIA extension is present in the certificate
#
# OUTPUTS (slots written)
#   aia_ok : "OUI" if AIA is present, "NON" if absent (including undef)
#
# GUARD — EXCEPTION: defined $f->{aia_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R19-gen-aia
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: 'defined $f->{aia_ok}'
ACTION: |
  # §4.4.1 GEN-4.4.1-2: AIA extension shall be present
  # Absence of has_aia slot = extension not present = NON
  my $aia = $f->get('has_aia') // '';
  $f->set('aia_ok', ($aia eq 'Y') ? 'OUI' : 'NON');
  1
