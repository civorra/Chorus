##
# RULE: R36-pk-algorithm
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §6.2 Table 2 + §10.2.4 Table 13 — ETSI TS 119 312 V2.1.1 — Subject public key algorithm
#
# PURPOSE
#   The subject public key algorithm OID in the certificate SHALL be one of the
#   approved algorithms defined in Table 2 (§6.2) and identified by the OIDs in
#   Table 13 (§10.2.4) of ETSI TS 119 312.
#   Legacy mechanisms (L) are accepted (they remain "agreed" — not discontinued).
#   Silently skips frames without pk_algorithm_oid.
#
# Approved public key algorithm OIDs (Table 13 — §10.2.4):
#   rsaEncryption   : 1.2.840.113549.1.1.1       — RSA (L + R depending on key size)
#   id-dsa          : 1.2.840.10040.4.1           — DSA (R)
#   id-ecPublicKey  : 1.2.840.10045.2.1           — ECDSA (R)
#   id-Ed25519      : 1.3.101.112                 — EdDSA Ed25519 (R)
#   id-Ed448        : 1.3.101.113                 — EdDSA Ed448 (R)
#   id-ml-dsa-44    : 2.16.840.1.101.3.4.3.17     — ML-DSA-44 (R)
#   id-ml-dsa-65    : 2.16.840.1.101.3.4.3.18     — ML-DSA-65 (R)
#   id-ml-dsa-87    : 2.16.840.1.101.3.4.3.19     — ML-DSA-87 (R)
#   id-slh-dsa-sha2-192s  : 2.16.840.1.101.3.4.3.22  — SLH-DSA (R)
#   id-slh-dsa-sha2-192f  : 2.16.840.1.101.3.4.3.23
#   id-slh-dsa-sha2-256s  : 2.16.840.1.101.3.4.3.24
#   id-slh-dsa-sha2-256f  : 2.16.840.1.101.3.4.3.25
#   id-slh-dsa-shake-192s : 2.16.840.1.101.3.4.3.28
#   id-slh-dsa-shake-192f : 2.16.840.1.101.3.4.3.29
#   id-slh-dsa-shake-256s : 2.16.840.1.101.3.4.3.30
#   id-slh-dsa-shake-256f : 2.16.840.1.101.3.4.3.31
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   pk_algorithm_oid      : OID string of the subject public key algorithm
#
# OUTPUTS (slots written)
#   pk_algorithm_ok       : OUI if OID is in approved list, NON otherwise
#
# GUARD — EXCEPTION: defined $f->{pk_algorithm_ok}
##
RULE: pk-algorithm
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: defined $f->{pk_algorithm_ok}
ACTION: |
  my $oid = $f->get('pk_algorithm_oid');
  return 0 unless defined $oid && length $oid;
  # §6.2 Table 2 + §10.2.4 Table 13: approved public key type OIDs
  # (both R and L mechanisms — discontinued ones are excluded)
  my %approved = map { $_ => 1 } qw(
    1.2.840.113549.1.1.1
    1.2.840.10040.4.1
    1.2.840.10045.2.1
    1.3.101.112
    1.3.101.113
    2.16.840.1.101.3.4.3.17
    2.16.840.1.101.3.4.3.18
    2.16.840.1.101.3.4.3.19
    2.16.840.1.101.3.4.3.22
    2.16.840.1.101.3.4.3.23
    2.16.840.1.101.3.4.3.24
    2.16.840.1.101.3.4.3.25
    2.16.840.1.101.3.4.3.28
    2.16.840.1.101.3.4.3.29
    2.16.840.1.101.3.4.3.30
    2.16.840.1.101.3.4.3.31
  );
  $f->set('pk_algorithm_ok', $approved{$oid} ? 'OUI' : 'NON');
  1
