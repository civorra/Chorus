##
# RULE: R33-qscd-statement-check
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §6.6.1 GEN-6.6.1-03/04 — ETSI EN 319 411-2 V2.6.1 — QSCD qcStatement
#
# PURPOSE
#   GEN-6.6.1-03: Certificates issued under QCP-n-qscd or QCP-l-qscd SHALL include
#   the esi4-qcStatement-4 (id-etsi-qcs-QcSSCD / QcQSCD).
#   GEN-6.6.1-04: Certificates NOT issued under QCP-n-qscd or QCP-l-qscd SHALL NOT
#   include the esi4-qcStatement-4.
#   Bi-directional constraint: presence IFF qscd policy.
#   Silently skips non-qualified frames or frames without cert_policy_oid.
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   is_qualified          : 'Y' if EU Qualified Certificate
#   cert_policy_oid       : OID string of the certificate policy
#   has_qcs_qscd          : 'Y' if esi4-qcStatement-4 (QcSSCD/QcQSCD) is present
#
# OUTPUTS (slots written)
#   qcs_qscd_ok           : OUI if QSCD statement presence matches policy, NON otherwise
#
# GUARD — EXCEPTION: defined $f->{qcs_qscd_ok}
##
RULE: qscd-statement-check
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: defined $f->{qcs_qscd_ok}
ACTION: |
  # Only applies to EU Qualified Certificates
  unless (($f->get('is_qualified') // '') eq 'Y') { return 0; }
  # Only if both cert_policy_oid and has_qcs_qscd are provided
  my $oid      = $f->get('cert_policy_oid');
  my $has_qscd = $f->get('has_qcs_qscd');
  return 0 unless defined $oid && defined $has_qscd;
  # §5.3: QSCD policies — qcp-natural-qscd (1.2) and qcp-legal-qscd (1.3)
  my $is_qscd_policy = ($oid eq '0.4.0.194112.1.2' || $oid eq '0.4.0.194112.1.3') ? 1 : 0;
  my $has_qscd_stmt  = ($has_qscd eq 'Y') ? 1 : 0;
  # GEN-6.6.1-03: qscd policy → must have statement
  # GEN-6.6.1-04: non-qscd policy → must NOT have statement
  my $ok = ($is_qscd_policy == $has_qscd_stmt) ? 'OUI' : 'NON';
  $f->set('qcs_qscd_ok', $ok);
  1
