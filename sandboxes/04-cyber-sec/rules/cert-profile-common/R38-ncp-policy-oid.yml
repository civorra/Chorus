##
# RULE: R38-ncp-policy-oid
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 3)
# CORPUS: §5.3 + §6.3.3 GEN-6.3.3-12 — ETSI EN 319 411-1 V1.5.1 — Non-QC policy OID
#
# PURPOSE
#   For non-qualified certificates (is_qualified not 'Y'), when a cert_policy_oid is
#   provided, it SHALL be one of the 7 standardized ETSI NCP/LCP/EVCP policy OIDs
#   defined in §5.3 of EN 319 411-1 (arc 0.4.0.2042.1.*):
#     0.4.0.2042.1.1  — NCP  (Normalized Certificate Policy)
#     0.4.0.2042.1.2  — NCP+ (Normalized Certificate Policy, secure device)
#     0.4.0.2042.1.3  — LCP  (Lightweight Certificate Policy)
#     0.4.0.2042.1.4  — EVCP (Extended Validation Certificate Policy)
#     0.4.0.2042.1.6  — DVCP (Domain Validation Certificate Policy)
#     0.4.0.2042.1.7  — OVCP (Organizational Validation Certificate Policy)
#     0.4.0.2042.1.8  — IVCP (Individual Validation Certificate Policy)
#   OR a TSP-defined OID enhancing one of the above policies (GEN-6.3.3-12 CHOICE).
#   When the OID is TSP-defined (not in the ETSI fixed list), the rule sets
#   ncp_policy_oid_ok = 'TSP-DEFINED' (informative — not a KO verdict).
#   Silently skips EU Qualified Certificate frames (handled by R32) and frames
#   without cert_policy_oid.
#
# INPUTS  (slots read)
#   needs_cert_validation : targeting slot — set by Feed.pm
#   is_qualified          : 'Y' if EU Qualified Certificate (skip — covered by R32)
#   cert_policy_oid       : OID string of the certificate policy in certificatePolicies
#
# OUTPUTS (slots written)
#   ncp_policy_oid_ok     : OUI if ETSI standard OID, TSP-DEFINED if not in ETSI list,
#                           NON if cert_policy_oid is set but known-invalid (e.g., discontinued)
#
# GUARD — EXCEPTION: defined $f->{ncp_policy_oid_ok}
##
RULE: ncp-policy-oid
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: defined $f->{ncp_policy_oid_ok}
ACTION: |
  # Skip EU Qualified Certificates — covered by R32
  return 0 if (($f->get('is_qualified') // '') eq 'Y');
  # Only if cert_policy_oid is provided
  my $oid = $f->get('cert_policy_oid');
  return 0 unless defined $oid && length $oid;
  # §5.3: 7 standard ETSI NCP/LCP/EVCP policy OIDs (arc 0.4.0.2042.1.*)
  my %etsi_oids = map { $_ => 1 } qw(
    0.4.0.2042.1.1
    0.4.0.2042.1.2
    0.4.0.2042.1.3
    0.4.0.2042.1.4
    0.4.0.2042.1.6
    0.4.0.2042.1.7
    0.4.0.2042.1.8
  );
  if ($etsi_oids{$oid}) {
    $f->set('ncp_policy_oid_ok', 'OUI');
  } else {
    # GEN-6.3.3-12 CHOICE: TSP-defined OID enhancing a policy is allowed
    # We cannot verify TSP-defined OIDs without external documentation
    $f->set('ncp_policy_oid_ok', 'TSP-DEFINED');
  }
  1
