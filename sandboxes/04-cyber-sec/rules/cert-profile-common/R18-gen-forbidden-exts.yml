##
# RULE: R18-gen-forbidden-exts
# AGENT: CyberSec::Agent::CertProfileCommon  (pos. 1 / 2)
# CORPUS: §4.3.4, §4.3.8, §4.3.9, §4.3.12 — ETSI EN 319 412-2 V2.4.1
#         GEN-4.3.4-1: policyMappings SHALL NOT be present
#         GEN-4.3.8-1: nameConstraints SHALL NOT be present
#         GEN-4.3.9-1: policyConstraints SHALL NOT be present
#         GEN-4.3.12-1: inhibitAnyPolicy SHALL NOT be present
#
# PURPOSE
#   Validates that the four extensions that are not applicable to end-entity certificates
#   (as addressed by ETSI EN 319 412-2) are absent. Any one of them being present
#   makes the certificate non-conformant.
#   Applies to all SubjectIdentifier frames (nat / leg / web / gen).
#
# INPUTS  (slots read)
#   needs_cert_validation    : targeting slot — set by Feed.pm
#   has_policy_mappings      : 'Y' if policyMappings extension present (should be absent)
#   has_name_constraints     : 'Y' if nameConstraints extension present (should be absent)
#   has_policy_constraints   : 'Y' if policyConstraints extension present (should be absent)
#   has_inhibit_any_policy   : 'Y' if inhibitAnyPolicy extension present (should be absent)
#
# OUTPUTS (slots written)
#   forbidden_exts_ok : "OUI" if all four extensions are absent, "NON" if any is present
#
# GUARD — EXCEPTION: defined $f->{forbidden_exts_ok}
#   Idempotence — prevents re-processing a frame already handled in a previous cycle.
##
RULE: R18-gen-forbidden-exts
FIND:
  f:
    attribut: needs_cert_validation
    filtre: '$_->get("type_element") ne "cert_ext"'
EXCEPTION: 'defined $f->{forbidden_exts_ok}'
ACTION: |
  # §4.3.4 GEN-4.3.4-1: policyMappings shall not be present
  # §4.3.8 GEN-4.3.8-1: nameConstraints shall not be present
  # §4.3.9 GEN-4.3.9-1: policyConstraints shall not be present
  # §4.3.12 GEN-4.3.12-1: inhibitAnyPolicy shall not be present
  # Absent slot = extension absent = conformant (default '')
  my $pm  = $f->get('has_policy_mappings')    // '';
  my $nc  = $f->get('has_name_constraints')   // '';
  my $pc  = $f->get('has_policy_constraints') // '';
  my $iap = $f->get('has_inhibit_any_policy') // '';
  my $ok = ($pm ne 'Y' && $nc ne 'Y' && $pc ne 'Y' && $iap ne 'Y') ? 'OUI' : 'NON';
  $f->set('forbidden_exts_ok', $ok);
  1
